<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Quick Vélez">
<title>Quick Ruteo · Cueros Vélez</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --amarillo:#FFD200; --amarillo-osc:#E6BD00; --negro:#111111; --negro-2:#1E1E1E; --gris:#6B6B6B;
  --gris-cl:#F2F2F0; --borde:#E2E2DE; --blanco:#FFFFFF;
  --rojo:#D93025; --verde:#1E8E3E; --naranja:#F29900; --azul:#1A73E8;
  --radio:14px; --sombra:0 2px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--gris-cl);color:var(--negro);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}

/* ── Login */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:var(--negro);color:#fff}
.marca{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.marca .rayo{width:44px;height:44px;border-radius:12px;background:var(--amarillo);display:grid;place-items:center}
.marca b{font-size:28px;letter-spacing:.5px}
.marca b span{color:var(--amarillo)}
#login p.sub{color:#bdbdbd;margin:0 0 28px}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-size:13px;color:#bdbdbd;margin-bottom:6px}
#login input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #333;background:var(--negro-2);color:#fff;font-size:18px;outline:none}
#login input:focus{border-color:var(--amarillo)}
.btn-pri{width:100%;padding:15px;border-radius:12px;background:var(--amarillo);color:var(--negro);font-weight:700;font-size:16px}
.btn-pri:active{background:var(--amarillo-osc)}
.btn-pri:disabled{opacity:.5}
#loginError{color:#ff8a80;min-height:22px;margin-top:10px;font-size:14px}

/* ── App */
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--negro);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.fila-top{display:flex;align-items:center;gap:10px}
.fila-top .rayo{width:32px;height:32px;border-radius:9px;background:var(--amarillo);display:grid;place-items:center;flex:none}
.quien{flex:1;min-width:0}
.quien b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien small{color:#bdbdbd}
.ico-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ico-btn:active{background:#2a2a2a}
#syncBadge{font-size:12px;padding:4px 9px;border-radius:99px;background:#2a2a2a;color:#fff;white-space:nowrap}
#syncBadge.pend{background:var(--naranja);color:var(--negro);font-weight:700}
#syncBadge.err{background:var(--rojo)}
.resumen{display:flex;gap:8px;margin:12px 0}
.kpi{flex:1;background:var(--negro-2);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:20px;color:var(--amarillo)}
.kpi small{color:#bdbdbd;font-size:12px}
.tabs{display:flex}
.selfie{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.selfie .ph{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--gris-cl);border:3px solid var(--amarillo);display:grid;place-items:center;flex:none}
.selfie .ph img{width:100%;height:100%;object-fit:cover}
.selfie button{padding:11px 14px;border-radius:10px;background:var(--negro);color:var(--amarillo);font-weight:800}
.dato-t{background:var(--gris-cl);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.dato-t div+div{margin-top:3px}
.aviso-t{background:#FFF4E5;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13.5px;color:#7a4b00}
.tipos{display:flex;gap:6px;margin:0 0 12px}
/* v2.5: turno compacto en la cabecera, selector de fecha en la fila de pestañas */
.tpill{display:inline-flex;align-items:center;gap:6px;margin-top:3px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#2a2a2a;color:#ddd;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpill i{width:8px;height:8px;border-radius:50%;background:#777;flex:none}
.tpill.on i{background:#34c759} .tpill.off{background:var(--amarillo);color:var(--negro)} .tpill.off i{background:var(--negro)}
.tpill.exc{background:#5a1a16;color:#ffb4ab} .tpill.exc i{background:#ff6b5e}
.tabs{align-items:stretch}
.tabs .tab{flex:1}
.fbtn{flex:none;align-self:center;margin-left:6px;padding:6px 10px;border-radius:99px;background:#2a2a2a;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.fbtn.otro{background:var(--amarillo);color:var(--negro)}
#menuFecha{top:auto}
#menuFecha button small{color:var(--gris);margin-left:6px}
#menuFecha button.sel{background:#FFF6CC;font-weight:700}
.aviso-otros{display:flex;align-items:center;gap:8px;background:#FFF4E5;color:#7a4b00;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.aviso-otros span{flex:1} .aviso-otros button{font-weight:800;color:var(--negro);text-decoration:underline}
#soloMarca{padding:24px 16px 90px}
.sm-card{background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:22px 18px;text-align:center}
.sm-card .est{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:6px 14px;border-radius:99px;background:var(--gris-cl)}
.sm-card .est i{width:10px;height:10px;border-radius:50%;background:#999}
.sm-card .est.on i{background:#34c759} .sm-card .est.exc{background:#FDE7E7;color:var(--rojo)} .sm-card .est.exc i{background:var(--rojo)}
.sm-card .dur{font-size:40px;font-weight:800;margin:14px 0 2px;letter-spacing:-.5px}
.sm-card .sub2{color:var(--gris);font-size:13.5px;margin-bottom:18px}
.sm-card .btn-pri{font-size:17px;padding:17px}
.sm-card .btn-fin{width:100%;padding:17px;border-radius:12px;background:var(--negro);color:#fff;font-weight:800;font-size:17px}
.sm-nota{color:var(--gris);font-size:12.5px;text-align:center;margin-top:14px}
.aut-txt{max-height:42vh;overflow:auto;background:var(--gris-cl);border-radius:10px;padding:12px;font-size:13px;line-height:1.45;margin-bottom:12px}
.aut-txt p{margin:0 0 8px}
.aut-chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:12px}
.aut-chk input{width:22px;height:22px;flex:none;margin-top:1px}
.tipo{flex:1;padding:8px 6px;border-radius:10px;background:var(--negro-2);color:#bdbdbd;font-size:13px;font-weight:700;white-space:nowrap}
.tipo b{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:99px;background:#333;color:#fff;font-size:11.5px}
.tipo.act{background:var(--amarillo);color:var(--negro)} .tipo.act b{background:var(--negro);color:var(--amarillo)}
.tab{flex:1;padding:12px 0;color:#bdbdbd;font-weight:600;border-bottom:3px solid transparent}
.tab.act{color:#fff;border-color:var(--amarillo)}
#demoBanner{background:var(--amarillo);color:var(--negro);text-align:center;font-size:12px;font-weight:700;padding:4px}

main{flex:1;overflow:auto;position:relative}
#vistaLista{padding:12px 12px 90px}
.filtros{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chip{padding:7px 14px;border-radius:99px;background:#fff;border:1px solid var(--borde);font-size:14px;white-space:nowrap}
.chip.act{background:var(--negro);color:#fff;border-color:var(--negro)}
.vacio{text-align:center;color:var(--gris);padding:48px 16px}

.card{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);margin-bottom:12px;overflow:hidden;border-left:6px solid var(--borde)}
.card.p-Alta{border-left-color:var(--rojo)} .card.p-Media{border-left-color:var(--naranja)} .card.p-Baja{border-left-color:var(--azul)}
.card.cerrado{opacity:.72;border-left-color:var(--verde)} .card.cerrado.novedad{border-left-color:var(--rojo)}
.card-cab{display:flex;gap:12px;padding:12px 14px 6px;align-items:flex-start}
.num{width:30px;height:30px;border-radius:50%;background:var(--negro);color:var(--amarillo);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.card-tit{flex:1;min-width:0}
.card-tit b{display:block;font-size:16px}
.card-tit .dir{color:var(--gris);font-size:13px}
.etqs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px 56px}
.etq{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--gris-cl)}
.etq.alta{background:#FDE7E7;color:var(--rojo)} .etq.media{background:#FEF1D8;color:#9A6100} .etq.baja{background:#E3EEFD;color:var(--azul)}
.etq.fija{background:var(--negro);color:var(--amarillo)} .etq.adic{background:#FFF6CC;color:#6B5600}
.etq.ok{background:#E6F4EA;color:var(--verde)} .etq.nov{background:#FDE7E7;color:var(--rojo)}
.etq.venc{background:var(--rojo);color:#fff} .etq.porv{background:var(--naranja);color:var(--negro)} .etq.atiempo{background:#E6F4EA;color:var(--verde)}
.etq.sync{background:var(--naranja);color:var(--negro)}
.detalle{padding:0 14px 8px 56px;font-size:13.5px;color:#333}
.detalle div{margin-bottom:3px}
.detalle a{color:var(--azul)}
.acciones{display:flex;border-top:1px solid var(--borde)}
.acciones button{flex:1;padding:12px 6px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.acciones button+button{border-left:1px solid var(--borde)}
.acciones .cerrar-btn{background:var(--amarillo)}
.acciones button:active{background:var(--gris-cl)}
.acciones .cerrar-btn:active{background:var(--amarillo-osc)}

#vistaMapa{position:absolute;inset:0}
#mapa{position:absolute;inset:0;background:#e5e3df}
.mapa-ctrl{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:500}
.mapa-ctrl button{flex:1;padding:13px 8px;border-radius:12px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.b-neg{background:var(--negro);color:#fff} .b-ama{background:var(--amarillo);color:var(--negro)}
.pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);font-weight:800;font-size:13px}
.yo{width:18px;height:18px;border-radius:50%;background:var(--azul);border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.leaflet-popup-content{margin:10px 12px;font-size:13.5px}
.leaflet-popup-content button{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--amarillo);font-weight:700;width:100%}

/* ── Modal de cierre */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:flex-end}
.hoja{background:#fff;width:100%;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.hoja h2{margin:0 0 2px;font-size:19px}
.hoja .sub{color:var(--gris);font-size:13px;margin-bottom:14px}
.seg{display:flex;background:var(--gris-cl);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:11px;border-radius:9px;font-weight:700;color:var(--gris)}
.seg button.act.ok{background:var(--verde);color:#fff}
.seg button.act.nov{background:var(--rojo);color:#fff}
.hoja label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.hoja input[type=text],.hoja select,.hoja textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--borde);background:#fff;margin-bottom:14px;outline:none}
.hoja input:focus,.hoja select:focus,.hoja textarea:focus{border-color:var(--negro)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--gris-cl)}
.foto img{width:100%;height:100%;object-fit:cover}
.foto button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-weight:700}
.add-foto{aspect-ratio:1;border-radius:10px;border:2px dashed #c8c8c2;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gris);font-size:12px;font-weight:600;gap:4px}
.fila-btn{display:flex;gap:10px}
.fila-btn .btn-sec{flex:1;padding:15px;border-radius:12px;background:var(--gris-cl);font-weight:700}
.fila-btn .btn-pri{flex:2}
#cierreError{color:var(--rojo);font-size:14px;min-height:20px;margin-bottom:8px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140px);background:var(--negro);color:#fff;padding:12px 18px;border-radius:12px;z-index:2000;max-width:90%;transition:transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px}
#toast.ver{transform:translateX(-50%) translateY(0)}
#toast.nuevo{background:var(--amarillo);color:var(--negro);font-weight:700}
.menu{position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top));background:#fff;color:var(--negro);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:1500;min-width:220px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;padding:14px 16px}
.menu button+button{border-top:1px solid var(--borde)}
.cola-item{background:#FFF4E5;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.cola-item .fila-btn{margin-top:8px}
.cola-item .fila-btn button{padding:8px;border-radius:8px;font-weight:700;flex:1}
.spin{width:18px;height:18px;border:2.5px solid rgba(0,0,0,.2);border-top-color:var(--negro);border-radius:50%;animation:g .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes g{to{transform:rotate(360deg)}}

/* ── v2: recoge / entrega, trazabilidad, ruteo */
.resumen .kpi b{font-size:18px}
.resumen .kpi small{font-size:11px;line-height:1.2;display:block}
.puntos{padding:0 14px 8px 56px;font-size:13.5px}
.punto{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.punto .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;margin-top:1px}
.punto .ic.r{background:var(--amarillo);color:var(--negro)} .punto .ic.e{background:var(--negro);color:var(--amarillo)}
.punto.hecho{opacity:.55} .punto.hecho b::after{content:' ✓';color:var(--verde)}
.punto.sig b{text-decoration:underline;text-decoration-color:var(--amarillo);text-decoration-thickness:3px;text-underline-offset:3px}
.punto small{display:block;color:var(--gris)}
.traza{display:flex;align-items:center;gap:4px;padding:0 14px 10px 56px;font-size:11.5px;color:var(--gris);flex-wrap:wrap}
.traza span{padding:2px 7px;border-radius:99px;background:var(--gris-cl)}
.traza span.ok{background:#E6F4EA;color:var(--verde);font-weight:700}
.traza span.nov{background:#FDE7E7;color:var(--rojo);font-weight:700}
.traza i{font-style:normal;color:#bbb}
.card-tit .accion{font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--gris);text-transform:uppercase}
.etq.eta{background:var(--negro);color:#fff}
.etq.sinub{background:#FDE7E7;color:var(--rojo)}
.acciones .aceptar-btn{background:var(--negro);color:var(--amarillo)}
.acciones .aceptar-btn:active{background:#333}
.barra-aceptar{display:flex;align-items:center;gap:10px;background:var(--negro);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.barra-aceptar span{flex:1;font-size:14px}
.barra-aceptar button{background:var(--amarillo);color:var(--negro);font-weight:800;padding:9px 14px;border-radius:9px}
.pin.r{background:var(--amarillo)} .pin.r span{color:var(--negro)}
.pin.e{background:var(--negro)} .pin.e span{color:var(--amarillo)}
.pin.x{background:var(--negro)} .pin.x span{color:#fff}
.pin.t{background:var(--azul)} .pin.t span{color:#fff}
.punto .ic.t{background:var(--azul);color:#fff}
.etq.tq{background:var(--azul);color:#fff} .etq.dir{background:#FFF6CC;color:#6B5600}
.trueque{margin:0 14px 10px 56px;padding:8px 10px;border-radius:8px;background:#E8F0FE;border-left:4px solid var(--azul);font-size:13.5px;color:#0b3a8c}
.trueque b{color:#0b3a8c}
.acciones .espera-btn{color:var(--gris);font-size:13px}
.pop-item{border-top:1px solid var(--borde);padding-top:6px;margin-top:6px}
.leyenda{position:absolute;top:12px;left:12px;z-index:500;background:#fff;border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:var(--sombra);display:flex;gap:10px}
.leyenda b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.hoja .ruta-pts{background:var(--gris-cl);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.hoja .ruta-pts div+div{margin-top:4px}
.contacto{display:flex;align-items:center;gap:8px;margin:0 14px 10px 56px;font-size:13.5px}
.contacto .nom{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333}
.contacto a{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:9px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.contacto .tel{background:var(--gris-cl);color:var(--negro)}
.contacto .wa{background:#1FA855;color:#fff}
.indic{margin:0 14px 10px 56px;padding:8px 10px;border-radius:8px;background:#FFF6CC;border-left:4px solid var(--amarillo);font-size:13.5px;color:#3a3000;white-space:pre-line}
.indic b{display:block;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#6B5600;margin-bottom:2px}
</style>
</head>
<body>

<!-- ═════════ LOGIN ═════════ -->
<section id="login" class="oculto">
  <div class="marca">
    <div class="rayo"><svg width="22" height="26" viewBox="0 0 22 26"><path d="M13 0L0 15h8l-2 11L22 10h-9z" fill="#111"/></svg></div>
    <b>QUICK <span>RUTEO</span></b>
  </div>
  <p class="sub">Pedidos Cueros Vélez</p>
  <label class="campo"><span>Código de conductor</span><input id="inCodigo" autocomplete="username" autocapitalize="characters" placeholder="Ej: C01"></label>
  <label class="campo"><span>PIN</span><input id="inPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></label>
  <button class="btn-pri" id="btnLogin">Ingresar</button>
  <div id="loginError"></div>
</section>

<!-- ═════════ APP ═════════ -->
<section id="app" class="oculto">
  <div id="demoBanner" class="oculto">MODO DEMO · datos de prueba, nada se guarda</div>
  <header>
    <div class="fila-top">
      <div class="rayo"><svg width="15" height="18" viewBox="0 0 22 26"><path d="M13 0L0 15h8l-2 11L22 10h-9z" fill="#111"/></svg></div>
      <div class="quien"><b id="hNombre">—</b><button class="tpill off oculto" id="turnoPill"></button></div>
      <span id="syncBadge">En línea</span>
      <button class="ico-btn" id="btnRefrescar" aria-label="Actualizar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      </button>
      <button class="ico-btn" id="btnMenu" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
    <div class="resumen">
      <div class="kpi"><b id="kAcep">0</b><small>Por aceptar</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   QUICK RUTEO — app del mensajero · Cueros Vélez v1.0
   CONFIGURACIÓN — URL de la aplicación web de Apps Script.
   Si se deja vacía (o se abre con ?demo=1) la app funciona en modo demo.
   ════════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxYgBoaJAkNFSI-luXZj1FedQ76XMhBnCCFSNXwG_NQJgmFPjGM1Hz-JkZbf7g5G6vKYw/exec';   // ← PEGA AQUÍ la URL /exec de la implementación de Apps Script de Cueros Vélez (vacía = modo demo)

const FOTOS_MIN = {R: 1, T: 1, B: 0, E: 1}, FOTOS_MAX = 5, FOTO_LADO = 1280, FOTO_CALIDAD = 0.7;
const POLL_MS = 60000, MIN_POR_VENCER = 30;
// Ruteo: velocidad urbana promedio, factor calles vs línea recta, minutos por parada
const RUTA = {VEL_KMH: 18, FACTOR: 1.35, MIN_PARADA: 6, PEN_PRIORIDAD: {Alta: 0, Media: 15, Baja: 30}, MISMO_PUNTO_KM: 0.12};
const MOTIVOS = ['Cliente ausente','Dirección errada','Rechazado por el cliente','Sin acceso / seguridad',
  'Pedido no listo en tienda','Producto incompleto o dañado','Reprogramado por el cliente','Trueque no realizado','Otro'];
const RANGO_P = {Alta:0, Media:1, Baja:2};
const DEMO = !API_URL || new URLSearchParams(location.search).has('demo');

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

try { const t0 = JSON.parse(localStorage.getItem('cv_tipo')); if (t0 && !['todos','Directo','Trueque'].includes(t0)) localStorage.removeItem('cv_tipo'); } catch(e){}
let S = {
  sesion: ls.get('cv_sesion', null),
  servicios: ls.get('cv_servicios', []),
  vista: 'lista', filtro: 'pend', abierto: null, tipo: ls.get('cv_tipo', 'todos'),
  pos: null, idsVistos: null, cola: [], sincronizando: false,
  cierre: null, mapa: null, capa: null, plan: null,
  turnoSrv: ls.get('cv_turno', {estado: 'Sin turno'}), prec: null, mTurno: null,
  perfil: ls.get('cv_perfil', {marca: true, ve: true, autorizado: false, jornadaHoras: 12}), fecha: '', otros: 0
};

/* ───────────── IndexedDB: cola de eventos (aceptar / recoger / entregar, con fotos) ───────────── */
const DB = (() => {
  let dbp = null;
  function abrir(){
    if (dbp) return dbp;
    dbp = new Promise((ok, mal) => {
      const r = indexedDB.open('quickruteo_cueros_velez', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('cola', {keyPath: 'jobId'});
      r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
    });
    return dbp;
  }
  async function tx(modo, fn){
    const db = await abrir();
    return new Promise((ok, mal) => {
      const t = db.transaction('cola', modo); const st = t.objectStore('cola');
      const res = fn(st); t.oncomplete = () => ok(res && res.result); t.onerror = () => mal(t.error);
    });
  }
  return {
    todos: () => tx('readonly', st => st.getAll()),
    poner: (j) => tx('readwrite', st => st.put(j)),
    quitar: (id) => tx('readwrite', st => st.delete(id))
  };
})();

/* ───────────── API ───────────── */
async function api(accion, datos){
  if (DEMO) return demoApi(accion, datos || {});
  const cuerpo = Object.assign({accion, token: S.sesion && S.sesion.token}, datos || {});
  let r;
  try {
    r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(cuerpo), redirect:'follow'});
  } catch(e){ const err = new Error('Sin conexión'); err.red = true; throw err; }
  if (!r.ok){ const err = new Error('Servidor no disponible ('+r.status+')'); err.red = true; throw err; }
  const j = await r.json();
  if (!j.ok){
    if (j.error === 'SESION'){ salir(true); }
    const err = new Error(j.mensaje || j.error || 'Error'); err.servidor = true; throw err;
  }
  return j;
}

/* ───────────── Fechas ───────────── */
function hoyTxt(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function minutosAhora(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function aMin(h){ if (!h) return null; const [a,b] = h.split(':').map(Number); return isNaN(a) ? null : a*60+(b||0); }
function aHora(m){ if (m == null || m >= 1440) return ''; m = Math.round(m); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function hhmm(iso){ const d = new Date(iso); return isNaN(d) ? '' : String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fechaLarga(){ return new Date().toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'long'}); }

/* ───────────── Arranque ───────────── */
function iniciarApp(){
  if (DEMO) $('#demoBanner').classList.remove('oculto');
  if (!S.sesion){ $('#login').classList.remove('oculto'); $('#app').classList.add('oculto'); return; }
  $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
  $('#hNombre').textContent = S.sesion.nombre;
  aplicarPerfil();
  render();
  cargar(true);
  procesarCola();
  ubicar();
}

$('#btnLogin').onclick = async () => {
  const codigo = $('#inCodigo').value.trim().toUpperCase(), pin = $('#inPin').value.trim();
  $('#loginError').textContent = '';
  if (!codigo || !pin){ $('#loginError').textContent = 'Ingresa tu código y PIN'; return; }
  const b = $('#btnLogin'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    const r = await api('login', {codigo, pin});
    S.sesion = {token: r.token, nombre: r.nombre, codigo: r.codigo};
    if (r.perfil){ S.perfil = r.perfil; ls.set('cv_perfil', S.perfil); }
    S.fecha = '';
    ls.set('cv_sesion', S.sesion);
    S.idsVistos = null;
    pedirAvisos();
    iniciarApp();
  } catch(e){ $('#loginError').textContent = e.red ? 'Sin conexión. Intenta de nuevo con señal.' : e.message; }
  finally { b.disabled = false; b.textContent = 'Ingresar'; }
};
$('#inPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });

function salir(vencida){
  S.sesion = null; ls.del('cv_sesion'); ls.del('cv_servicios'); ls.del('cv_turno'); ls.del('cv_perfil'); S.servicios = []; S.idsVistos = null; S.turnoSrv = {estado: 'Sin turno'};
  $('#menu').classList.add('oculto');
  iniciarApp();
  if (vencida) $('#loginError').textContent = 'Tu sesión venció. Ingresa de nuevo.';
}

/* ───────────── Carga y sondeo ───────────── */
async function cargar(silencioso){
  if (!S.sesion) return;
  try {
    const pedido = S.fecha;
    const r = await api('servicios', {fecha: pedido});
    if (pedido !== S.fecha) return;   // el usuario cambió de fecha mientras cargaba
    const ids = new Set(r.servicios.map(s => s.id));
    if (S.idsVistos){
      const nuevos = r.servicios.filter(s => !S.idsVistos.has(s.id) && abierto(s));
      if (nuevos.length) avisarNuevos(nuevos);
    }
    S.idsVistos = ids;
    S.servicios = r.servicios.map(normalizarServicio);
    if (r.turno){ S.turnoSrv = r.turno; ls.set('cv_turno', S.turnoSrv); }
    if (r.perfil){ S.perfil = r.perfil; ls.set('cv_perfil', S.perfil); aplicarPerfil(); }
    S.otros = r.otros || 0;
    if (!S.fecha) ls.set('cv_servicios', S.servicios);
    estadoRed(true);
    render();
  } catch(e){
    if (e.red) estadoRed(false);
    if (!silencioso) toast(e.red ? 'Sin conexión: mostrando la última información guardada' : e.message);
  }
}
function normalizarServicio(s){
  if (s.estado === 'En curso') s.estado = 'Aceptado';
  ['lat','lng','latO','lngO'].forEach(k => { const n = parseFloat(String(s[k] ?? '').replace(',', '.')); s[k] = isFinite(n) && n !== 0 ? n : null; });
  return s;
}
setInterval(() => { if (document.visibilityState === 'visible'){ cargar(true); procesarCola(); ubicar(); } }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.sesion){ cargar(true); procesarCola(); } });
window.addEventListener('online', () => { estadoRed(true); procesarCola(); cargar(true); });
window.addEventListener('offline', () => estadoRed(false));

let enLinea = navigator.onLine;
function estadoRed(v){ enLinea = v; pintarSync(); }

function ubicar(){
  return new Promise(ok => {
    if (!navigator.geolocation) return ok(S.pos);
    navigator.geolocation.getCurrentPosition(p => {
      const nuevo = !S.pos;
      S.pos = {lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6)};
      if (nuevo) render(); else if (S.mapa) pintarYo();
      if (S.sesion && enLinea) api('ubicacion', S.pos).catch(() => {});
      ok(S.pos);
    }, () => ok(S.pos), {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  });
}

/* ───────────── Avisos de servicios nuevos ───────────── */
function avisarNuevos(nuevos){
  const txt = nuevos.length === 1
    ? (nuevos[0].rol === 'B' ? 'Nuevo trueque: recibes de ' + nuevos[0].otro + ' · ' : 'Nuevo pedido: ' + (nuevos[0].sedeOrigen ? nuevos[0].sedeOrigen + ' → ' : '')) + (nuevos[0].sedeDestino || nuevos[0].direccion || nuevos[0].id)
    : nuevos.length + ' pedidos nuevos asignados';
  toast(txt, true);
  try { navigator.vibrate && navigator.vibrate([250,120,250]); } catch(e){}
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .22].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.18); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2); });
  } catch(e){}
  if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker){
    navigator.serviceWorker.ready.then(reg => reg.showNotification('Quick Ruteo · Cueros Vélez', {body: txt, icon:'icon-192.png', badge:'icon-192.png', tag:'nuevos', renotify:true})).catch(()=>{});
  }
}
function pedirAvisos(){ if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(()=>{}); }

/* ───────────── Estados y etapas ───────────── */
/* Rol del mensajero en el pedido: A = recoge en tienda (y entrega si es directo) · B = recibe en trueque y entrega al cliente */
function esTq(s){ return s.modalidad === 'Trueque'; }
function rolB(s){ return esTq(s) && s.rol === 'B'; }
function abierto(s){
  if (!['Pendiente','Aceptado','Recogido','Transferido','Recibido','En curso'].includes(s.estado)) return false;
  if (esTq(s) && s.rol === 'A' && ['Transferido','Recibido'].includes(s.estado)) return false;   // A ya lo entregó al compañero
  return true;
}
function tieneOrigen(s){ return !!(s.sedeOrigen || s.dirOrigen || (s.latO && s.lngO)); }
function tienePunto(s){ return !!(s.punto && s.punto.lat && s.punto.lng); }
/** Próximo paso: A → aceptar · recoger · (transferir | entregar)   B → esperar · recibir · entregar */
function paso(s){
  if (!abierto(s)) return null;
  if (rolB(s)){
    if (['Pendiente','Aceptado','En curso'].includes(s.estado)) return 'esperar';
    if (s.estado === 'Recogido' || s.estado === 'Transferido') return 'recibir';
    return 'entregar';
  }
  if (s.estado === 'Pendiente') return 'aceptar';
  if (s.estado === 'Aceptado' && tieneOrigen(s)) return 'recoger';
  return esTq(s) ? 'transferir' : 'entregar';
}
/** Aplica sobre el servicio los eventos que aún están en la cola del celular. */
function vista(s){
  const jobs = S.cola.filter(j => j.id === s.id);
  if (!jobs.length) return s;
  const v = Object.assign({}, s, {_sync: true, _err: jobs.some(j => j.error) ? jobs.find(j => j.error).error : null});
  jobs.forEach(j => {
    if (j.tipo === 'aceptar' && v.estado === 'Pendiente'){ v.estado = 'Aceptado'; v.horaAceptado = v.horaAceptado || hhmm(j.hora); }
    if (j.tipo === 'recoger' && abierto(v)){ v.estado = 'Recogido'; v.horaAceptado = v.horaAceptado || hhmm(j.hora); v.horaRecogido = hhmm(j.hora); v.entregaOrigen = j.persona; }
    if (j.tipo === 'transferir' && ['Recogido','Aceptado'].includes(v.estado)){ v.estado = 'Transferido'; v.horaTransferido = hhmm(j.hora); }
    if (j.tipo === 'recibir' && ['Recogido','Transferido'].includes(v.estado)){ v.estado = 'Recibido'; v.horaRecibido = hhmm(j.hora); }
    if (j.tipo === 'cerrar'){ v.estado = j.estado; v.horaAceptado = v.horaAceptado || hhmm(j.hora); v.horaCierre = hhmm(j.hora); v.recibe = j.persona; v.motivo = j.motivo; }
  });
  return v;
}
function semaforo(s){
  if (!abierto(s)) return null;
  if (s.fecha && s.fecha > hoyTxt()) return {c:'atiempo', t:'Programado ' + s.fecha.slice(8) + '/' + s.fecha.slice(5,7)};
  if (s.fecha && s.fecha < hoyTxt()) return {c:'venc', t:'Atrasado de ' + s.fecha.slice(5)};
  const h = aMin(s.hasta); if (h == null) return null;
  const falta = h - minutosAhora();
  if (falta < 0) return {c:'venc', t:'Vencido ' + s.hasta};
  if (falta <= MIN_POR_VENCER) return {c:'porv', t:'Vence en ' + falta + ' min'};
  return {c:'atiempo', t:'A tiempo'};
}

/* ───────────── RUTEO LÓGICO ─────────────
   El coordinador asigna y publica; el celular ordena las paradas del mensajero desde donde está.
   Paradas: R = recoger en tienda · T = entregar al compañero en el punto de encuentro (trueque) ·
            B = recibir del compañero en el punto · E = entregar al cliente.
   Reglas: la entrega espera a su recogida (o a recibir el pedido); el trueque no se hace antes de la hora pactada;
   la franja del cliente (desde) aplica a la entrega; la espera pesa 1,5×; prioridad Media +15 min y Baja +30 min;
   se adelanta lo que va a vencer; paradas en el mismo sitio (< 120 m) se agrupan. */
function km(a, b){
  const R = 6371, dLat = (b.lat-a.lat)*Math.PI/180, dLng = (b.lng-a.lng)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function minViaje(a, b){ return a && b ? km(a, b) * RUTA.FACTOR / RUTA.VEL_KMH * 60 : 0; }

function paradasDe(s){
  const pR = s.latO && s.lngO ? {lat: s.latO, lng: s.lngO} : null;
  const pE = s.lat && s.lng ? {lat: s.lat, lng: s.lng} : null;
  const pT = tienePunto(s) ? {lat: s.punto.lat, lng: s.punto.lng} : null;
  const base = {s, prio: s.prioridad || 'Media', hasta: aMin(s.hasta), atrasado: s.fecha && s.fecha < hoyTxt()};
  const hT = aMin(s.horaTrueque);
  const p = paso(s), out = [];
  const st = (tipo, pt, extra) => out.push(Object.assign({key: s.id+'|'+tipo, tipo, lat: pt.lat, lng: pt.lng}, base, extra || {}));
  if (rolB(s)){
    if (!pT || !pE) return null;
    if (p !== 'entregar') st('B', pT, {desde: hT, sig: pE});
    st('E', pE, {desde: aMin(s.desde), requiere: p !== 'entregar' ? s.id+'|B' : null});
    return out;
  }
  const necesitaR = p === 'aceptar' || p === 'recoger';
  if ((necesitaR && tieneOrigen(s) && !pR)) return null;
  if (esTq(s)){
    if (!pT) return null;
    if (necesitaR && pR) st('R', pR, {desde: null, sig: pT});
    st('T', pT, {desde: hT, requiere: necesitaR && pR ? s.id+'|R' : null, sig: pE});
    return out;
  }
  if (!pE) return null;
  if (necesitaR && pR) st('R', pR, {desde: null, sig: pE});
  st('E', pE, {desde: aMin(s.desde), requiere: necesitaR && pR ? s.id+'|R' : null});
  return out;
}

function planificar(lista){
  const paradasSueltas = [], sinUbic = [];
  lista.filter(abierto).forEach(s => {
    const ps = paradasDe(s);
    if (!ps){ sinUbic.push(s.id); return; }
    ps.forEach(p => paradasSueltas.push(p));
  });

  let cur = S.pos, t = minutosAhora();
  const pend = paradasSueltas.slice(), hechas = new Set(), seq = [];
  while (pend.length){
    let mejor = null;
    pend.forEach((p, i) => {
      if (p.requiere && !hechas.has(p.requiere) && pend.some(x => x.key === p.requiere)) return;
      const viaje = minViaje(cur, p);
      const llega = t + viaje;
      const espera = (p.desde != null && llega < p.desde) ? p.desde - llega : 0;
      let costo = viaje + espera * 1.5 + (RUTA.PEN_PRIORIDAD[p.prio] ?? 15);
      if (cur && km(cur, p) < RUTA.MISMO_PUNTO_KM) costo -= 25;   // ya está en el sitio: consolidar
      if (p.atrasado) costo -= 40;
      else if (p.hasta != null){
        const fin = p.tipo === 'E' ? llega + espera : llega + espera + RUTA.MIN_PARADA + minViaje(p, p.sig);
        const holgura = p.hasta - fin;
        costo -= holgura < 0 ? 35 : holgura < 30 ? 22 : holgura < 60 ? 8 : 0;
      }
      if (p.tipo === 'T' || p.tipo === 'B') costo -= 10;   // el compañero cuenta con esa hora
      if (p.tipo === 'E' && p.requiere) costo -= 4;
      if (!mejor || costo < mejor.costo) mejor = {i, costo, llega: llega + espera};
    });
    if (!mejor) break;
    const p = pend.splice(mejor.i, 1)[0];
    p.eta = mejor.llega; seq.push(p); hechas.add(p.key);
    t = mejor.llega + RUTA.MIN_PARADA; cur = p;
  }

  const paradas = [];
  seq.forEach(p => {
    const ult = paradas[paradas.length-1];
    if (ult && km(ult, p) < RUTA.MISMO_PUNTO_KM) ult.items.push(p);
    else paradas.push({lat: p.lat, lng: p.lng, eta: p.eta, items: [p]});
  });
  paradas.forEach((pa, i) => {
    pa.n = i + 1;
    const a = pa.items[0];
    pa.nombre = a.tipo === 'R' ? (a.s.sedeOrigen || a.s.dirOrigen) : (a.tipo === 'T' || a.tipo === 'B') ? (a.s.punto && a.s.punto.nombre) : (a.s.sedeDestino || a.s.direccion);
    pa.dir = a.tipo === 'R' ? a.s.dirOrigen : (a.tipo === 'T' || a.tipo === 'B') ? (a.s.punto && a.s.punto.dir) : a.s.direccion;
    pa.tipos = new Set(pa.items.map(x => x.tipo));
  });
  const porServicio = new Map();
  paradas.forEach(pa => pa.items.forEach(it => {
    const o = porServicio.get(it.s.id) || {};
    if (!o.n){ o.n = pa.n; o.tipo = it.tipo; o.eta = pa.eta; }
    if (it.tipo === 'E') o.etaE = pa.eta;
    porServicio.set(it.s.id, o);
  }));
  return {paradas, porServicio, sinUbic};
}

const ACCION_TXT = {aceptar: 'Por aceptar', recoger: 'Siguiente: recoger en tienda', entregar: 'Siguiente: entregar al cliente',
  transferir: 'Siguiente: entregar al compañero', recibir: 'Siguiente: recibir del compañero', esperar: 'Trueque: esperando la recogida'};
function tarjeta(s){
  const sem = semaforo(s), cerrado = !abierto(s), p = paso(s), r = S.plan.porServicio.get(s.id);
  const tq = esTq(s), B = rolB(s), hT = s.horaTrueque || '';
  const ventana = s.desde || s.hasta ? `🕑 ${s.desde || '—'} – ${s.hasta || '—'}` : '';
  const etq = [];
  etq.push(`<span class="etq ${tq ? 'tq' : 'dir'}">${tq ? (B ? 'TRUEQUE · RECIBES' : 'TRUEQUE · ENTREGAS') : 'DIRECTO'}</span>`);
  if (!cerrado) etq.push(`<span class="etq ${(s.prioridad||'media').toLowerCase()}">${esc(s.prioridad||'Media')}</span>`);
  if (ventana) etq.push(`<span class="etq">${ventana}</span>`);
  if (sem && (sem.c !== 'atiempo' || (S.fecha === 'activos' && sem.t.startsWith('Programado')))) etq.push(`<span class="etq ${sem.c === 'atiempo' ? 'eta' : sem.c}">${sem.t}</span>`);
  if (!cerrado && r) etq.push(`<span class="etq eta">Parada ${r.n}${S.futuro ? '' : ' · llega ' + aHora(r.eta)}</span>`);
  if (!S.futuro && !cerrado && r && r.etaE && aMin(s.hasta) != null && r.etaE > aMin(s.hasta) && !(sem && sem.c === 'venc')) etq.push(`<span class="etq porv">Entrega estimada ${aHora(r.etaE)}</span>`);
  if (!cerrado && S.plan.sinUbic.includes(s.id)) etq.push(`<span class="etq sinub">Dirección sin ubicar en mapa</span>`);
  if (s._sync) etq.push(`<span class="etq sync">${s._err ? 'Error al enviar' : 'Pendiente de enviar'}</span>`);

  // Puntos de la ruta según el rol
  const recogido = !['Pendiente','Aceptado','En curso'].includes(s.estado);
  const ptNom = s.punto ? esc(s.punto.nombre || 'Punto de encuentro') : '';
  const ptDir = s.punto && s.punto.dir ? `<small>${esc(s.punto.dir)}</small>` : '';
  const filaR = `<div class="punto ${recogido ? 'hecho' : ''} ${p === 'recoger' || p === 'aceptar' ? 'sig' : ''}"><div class="ic r">↑</div>
      <div><b>Recoge en tienda: ${esc(s.sedeOrigen || s.dirOrigen)}</b>${s.dirOrigen && s.dirOrigen !== s.sedeOrigen ? `<small>${esc(s.dirOrigen)}</small>` : ''}</div></div>`;
  const filaE = `<div class="punto ${s.estado === 'Entregado' ? 'hecho' : ''} ${p === 'entregar' ? 'sig' : ''}"><div class="ic e">↓</div>
      <div><b>Entrega a: ${esc(s.sedeDestino || 'Cliente')}</b>${s.direccion ? `<small>${esc(s.direccion)}</small>` : ''}</div></div>`;
  let puntos;
  if (!tq) puntos = `<div class="puntos">${tieneOrigen(s) ? filaR : ''}${filaE}</div>`;
  else if (!B) puntos = `<div class="puntos">${filaR}
      <div class="punto ${['Transferido','Recibido','Entregado'].includes(s.estado) ? 'hecho' : ''} ${p === 'transferir' ? 'sig' : ''}"><div class="ic t">⇄</div>
      <div><b>Entrega a ${esc(s.otro)} en ${ptNom}${hT ? ' · ' + esc(hT) : ''}</b>${ptDir}</div></div>
      <div class="punto" style="opacity:.6"><div class="ic e">↓</div><div><small>Cliente final: ${esc(s.sedeDestino || '')} · ${esc(s.direccion || '')}</small></div></div></div>`;
  else puntos = `<div class="puntos">
      <div class="punto ${['Recibido','Entregado'].includes(s.estado) ? 'hecho' : ''} ${p === 'recibir' || p === 'esperar' ? 'sig' : ''}"><div class="ic t">⇄</div>
      <div><b>Recibe de ${esc(s.otro)} en ${ptNom}${hT ? ' · ' + esc(hT) : ''}</b>${ptDir}<small>Tienda: ${esc(s.sedeOrigen || '')}</small></div></div>${filaE}</div>`;
  const avisoTq = !cerrado && tq && (p === 'transferir' || p === 'recibir' || p === 'esperar')
    ? `<div class="trueque">${p === 'esperar' ? `⏳ <b>${esc(s.otro)}</b> aún no recoge este pedido en la tienda. Te avisamos cuando lo tenga.`
      : p === 'transferir' ? `⇄ Encuéntrate con <b>${esc(s.otro)}</b> en <b>${ptNom}</b>${hT ? ' a las <b>' + esc(hT) + '</b>' : ''}. Toma foto del pedido al entregarlo.`
      : `⇄ <b>${esc(s.otro)}</b> ${s.estado === 'Transferido' ? 'ya marcó la entrega' : 'ya tiene el pedido'}. Recíbelo en <b>${ptNom}</b>${hT ? ' a las <b>' + esc(hT) + '</b>' : ''}.`}${s.punto && s.punto.notas ? '<br><small>' + esc(s.punto.notas) + '</small>' : ''}</div>` : '';

  // Trazabilidad
  const pasos = [`<span class="${s.horaAceptado ? 'ok' : ''}">Aceptado ${s.horaAceptado || '—'}</span>`,
                 `<span class="${s.horaRecogido ? 'ok' : ''}">Recogido ${s.horaRecogido || '—'}</span>`];
  if (tq){
    pasos.push(`<span class="${s.horaTransferido || ['Transferido','Recibido','Entregado'].includes(s.estado) ? 'ok' : ''}">Traspaso ${s.horaTransferido || '—'}</span>`);
    pasos.push(`<span class="${s.horaRecibido ? 'ok' : ''}">Recibido ${s.horaRecibido || '—'}</span>`);
  }
  pasos.push(s.estado === 'Novedad' ? `<span class="nov">Novedad ${s.horaCierre || ''}</span>`

    : `<span class="${s.estado === 'Entregado' ? 'ok' : ''}">Entregado ${s.estado === 'Entregado' ? (s.horaCierre || '') : '—'}</span>`);
  const traza = `<div class="traza">${pasos.join('<i>›</i>')}</div>`;

  const abiertoDet = S.abierto === s.id;
  const det = abiertoDet ? `<div class="detalle">
      ${s.descripcion ? `<div>📦 ${esc(s.descripcion)}</div>` : ''}
      ${s.solicitud ? `<div># Pedido ${esc(s.solicitud)}</div>` : ''}
      ${cerrado && s.contactoE ? `<div>☎ Cliente: ${contactoHtml(s.contactoE)}</div>` : ''}
      ${s.entregaOrigen ? `<div>✍ Entregó en tienda: ${esc(s.entregaOrigen)}</div>` : ''}
      ${s.recibe ? `<div>✍ Recibió: ${esc(s.recibe)}</div>` : ''}
      ${s.motivo ? `<div>⚠ ${esc(s.motivo)}</div>` : ''}
      <div style="color:var(--gris)">ID ${esc(s.id)}</div>
    </div>` : '';
  const boton = p === 'aceptar' ? `<button class="aceptar-btn" data-acc="aceptar" data-id="${esc(s.id)}">Aceptar</button>`
    : p === 'recoger' ? `<button class="cerrar-btn" data-acc="recoger" data-id="${esc(s.id)}">Recoger ↑</button>`
    : p === 'transferir' ? `<button class="cerrar-btn" data-acc="transferir" data-id="${esc(s.id)}">Entregué a ${esc(String(s.otro).split(' ')[0])} ⇄</button>`
    : p === 'recibir' ? `<button class="cerrar-btn" data-acc="recibir" data-id="${esc(s.id)}">Recibí ⇄</button>`
    : p === 'esperar' ? `<button class="espera-btn" disabled>Esperando…</button>`
    : `<button class="cerrar-btn" data-acc="entregar" data-id="${esc(s.id)}">Entregar ✓</button>`;
  const acc = cerrado ? '' : `<div class="acciones">
      <button data-acc="nav" data-id="${esc(s.id)}">🧭 Navegar</button>
      <button data-acc="det" data-id="${esc(s.id)}">${abiertoDet ? 'Menos' : 'Detalle'}</button>
      ${boton}
    </div>`;
  const estadoTxt = cerrado && tq && !B && ['Transferido','Recibido'].includes(s.estado) ? 'Entregado a ' + s.otro : s.estado;
  const num = cerrado ? (s.estado === 'Entregado' || estadoTxt !== s.estado ? '✓' : '!') : (r ? r.n : '·');
  return `<div class="card p-${esc(s.prioridad)} ${cerrado ? 'cerrado' : ''} ${s.estado === 'Novedad' || s.estado === 'Cancelado' ? 'novedad' : ''}" data-id="${esc(s.id)}">
    <div class="card-cab" data-acc="det" data-id="${esc(s.id)}">
      <div class="num">${num}</div>
      <div class="card-tit"><div class="accion">${cerrado ? esc(estadoTxt) : ACCION_TXT[p]}${s.solicitud ? ' · #' + esc(s.solicitud) : ''}</div>
        <div class="etqs" style="padding:4px 0 0">${etq.join('')}</div></div>
    </div>
    ${puntos}${avisoTq}${!cerrado ? contactoBotones(s) : ''}${s.indicaciones && !cerrado ? `<div class="indic"><b>Indicaciones</b>${esc(s.indicaciones)}</div>` : ''}${traza}${det}${acc}</div>`;
}
/* Contacto: botón Llamar y, si es celular colombiano, botón WhatsApp con mensaje listo.
   Acepta "Laura Gómez 3001234567", "+57 300 123 4567", "Ing. Ruiz ext 4410" (este último sin WhatsApp). */
function telefonoDe(c){
  const txt = String(c || '');
  const m = txt.match(/(\+?57[\s.-]?)?(3\d{2}[\s.-]?\d{3}[\s.-]?\d{4}|60\d[\s.-]?\d{3}[\s.-]?\d{4})(?!\d)/) || txt.match(/\+?\(?\d[\d\s().-]{6,}\d/);
  if (!m) return null;
  const digitos = m[0].replace(/\D/g, '');
  let wa = null;
  if (/^3\d{9}$/.test(digitos)) wa = '57' + digitos;            // celular colombiano
  else if (/^573\d{9}$/.test(digitos)) wa = digitos;            // ya con indicativo
  return {texto: m[0], tel: m[0].trim().startsWith('+') ? '+' + digitos : digitos, wa};
}
/* Contacto según la etapa: antes de recoger se muestra el de RECOLECCIÓN; después de marcar Recogido,
   el de ENTREGA. Servicios sin punto de recogida muestran siempre el de entrega.
   Si falta el contacto de recolección, se muestra el de entrega (marcado como tal) para no dejar al conductor sin número. */
function contactoDe(s, cual){
  if (cual === 'R') return s.contactoR || '';
  return s.contactoE !== undefined ? s.contactoE : (s.contacto || '');
}
function contactoBotones(s){
  const p = paso(s);
  let rotulo, c, etapa;
  if (p === 'aceptar' || p === 'recoger'){ rotulo = 'Tienda'; c = s.contactoR; etapa = 'R'; }
  else if (p === 'transferir' || p === 'recibir' || p === 'esperar'){ rotulo = 'Compañero'; c = s.otro + ' ' + (s.telOtro || ''); etapa = 'T'; }
  else { rotulo = 'Cliente'; c = s.contactoE; etapa = 'E'; }
  if (!c && etapa === 'R'){ rotulo = 'Cliente'; c = s.contactoE; etapa = 'E'; }
  if (!String(c || '').trim()) return '';
  const t = telefonoDe(c);
  const nombre = esc(String(c).replace(t ? t.texto : '', '').replace(/[-–·,:]+\s*$/, '').trim());
  if (!t) return `<div class="contacto"><span class="nom">☎ <b>${rotulo}:</b> ${esc(c)}</span></div>`;
  const ref = s.solicitud ? 'el pedido ' + s.solicitud : 'el pedido ' + s.id;
  const yo = S.sesion ? S.sesion.nombre : 'el mensajero';
  const msg = etapa === 'E' ? `Hola, le escribe ${yo}, mensajero de Quick Help, por la entrega de su pedido Cueros Vélez${s.solicitud ? ' N° ' + s.solicitud : ''}.`
    : etapa === 'R' ? `Hola, le escribe ${yo} de Quick Help. Voy a recoger ${ref} de Cueros Vélez.`
    : `Hola ${s.otro}, soy ${yo}. Trueque de ${ref} en ${s.punto ? s.punto.nombre : 'el punto'}${s.horaTrueque ? ' a las ' + s.horaTrueque : ''}.`;
  return `<div class="contacto"><span class="nom">☎ <b>${rotulo}:</b> ${nombre || esc(t.texto)}</span>
    <a class="tel" href="tel:${t.tel}">📞 Llamar</a>
    ${t.wa ? `<a class="wa" href="https://wa.me/${t.wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</div>`;
}
function contactoHtml(c){
  const tel = (c.match(/\+?\d[\d\s-]{6,}\d/) || [])[0];
  return tel ? esc(c).replace(esc(tel), `<a href="tel:${tel.replace(/[\s-]/g,'')}">${esc(tel)}</a>`) : esc(c);
}

function servicioVista(id){ const s = S.servicios.find(x => x.id === id); return s ? vista(s) : null; }
/* ───────────── CONTROL DE TURNO (v2.5) ─────────────
   Según el perfil de la hoja Conductores:
     marca ✔  ve ✔  → conductor: registra turno y trabaja servicios (sin turno no puede aceptar/recoger/entregar)
     marca ✔  ve ✘  → auxiliar: la app solo muestra la pantalla de turno
     marca ✘  ve ✔  → externo: ve y trabaja servicios, sin registro de turno ni selfie
   Selfie obligatoria al marcar. (Cueros Vélez: sin autorización de datos en la app.) */
const SELFIE_TURNO = true;
const TURNO_BLOQUEA = true;
function turnoActual(){
  const t = Object.assign({}, S.turnoSrv || {estado: 'Sin turno'});
  if (t.estado === 'En pausa') t.estado = 'En turno';           // compatibilidad con turnos de la v2.4
  if (t.estado !== 'En turno') t.estado = 'Sin turno';
  S.cola.filter(j => j.tipo === 'turno').forEach(j => {
    if (j.accion === 'iniciar' && t.estado === 'Sin turno'){ t.estado = 'En turno'; t.inicio = j.hora; t.minPausa = 0; }
    if (j.accion === 'finalizar'){ t.estado = 'Sin turno'; }
  });
  return t;
}
function durTxt(min){ min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? h + ' h ' + String(m).padStart(2,'0') + ' min' : m + ' min'; }
function minTrabajados(t){ return t.inicio ? (Date.now() - new Date(t.inicio).getTime()) / 60000 - (t.minPausa || 0) : 0; }
function jornadaTxt(){ const p = S.perfil || {}; return p.jornadaInicio ? p.jornadaInicio + '–' + (p.jornadaFin || '') : (p.jornadaHoras || 12) + ' h'; }
function excede(t){ return t.estado === 'En turno' && minTrabajados(t) > (S.perfil.jornadaHoras || 12) * 60; }

function aplicarPerfil(){
  const p = S.perfil || {};
  const ve = p.ve !== false, marca = p.marca !== false;
  ['.resumen', '#tipos', '.tabs'].forEach(q => $(q).classList.toggle('oculto', !ve));
  $('#vistaLista').classList.toggle('oculto', !ve || S.vista !== 'lista');
  $('#vistaMapa').classList.toggle('oculto', !ve || S.vista !== 'mapa');
  $('#soloMarca').classList.toggle('oculto', ve);
  $('#turnoPill').classList.toggle('oculto', !marca || !ve);
  pintarTurno();
}
function pintarTurno(){
  const p = S.perfil || {}, t = turnoActual(), pill = $('#turnoPill');
  if (p.marca !== false && p.ve !== false){
    if (t.estado === 'En turno'){
      pill.className = 'tpill ' + (excede(t) ? 'exc' : 'on');
      pill.innerHTML = `<i></i>En turno · ${durTxt(minTrabajados(t))}${excede(t) ? ' · excede jornada' : ''}`;
    } else {
      pill.className = 'tpill off';
      pill.innerHTML = `<i></i>Iniciar turno ▸`;
    }

    box.innerHTML = `<div class="sm-card">
      <div class="est ${on ? (ex ? 'exc' : 'on') : ''}"><i></i>${on ? (ex ? 'Excede jornada' : 'En turno') : 'Turno sin iniciar'}</div>

    </div><div class="sm-nota">Tu usuario solo registra turno. La foto y la ubicación se guardan al marcar.</div>`;
  }
}

    $('#tError').textContent = '';
  } catch(err){ toast('No se pudo leer la foto'); }
};
function comprimirSelfie(file, etiqueta){
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 720 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      const sello = new Date().toLocaleString('es-CO') + ' · ' + etiqueta;
      const fs = Math.max(13, Math.round(c.width / 40));
      g.font = `bold ${fs}px sans-serif`;
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, c.height - fs*1.8, g.measureText(sello).width + fs, fs*1.8);
      g.fillStyle = '#FFD200'; g.fillText(sello, fs/2, c.height - fs*0.55);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}

function accion(acc, id){
  if (['aceptar','recoger','entregar','transferir','recibir'].includes(acc) && !exigirTurno()) return;
  const s = servicioVista(id); if (!s) return;
  if (acc === 'det'){ S.abierto = S.abierto === id ? null : id; render(); }
  if (acc === 'nav') navegarServicio(s);
  if (acc === 'aceptar') aceptar([s]);
  if (acc === 'recoger') abrirCierre(s, 'R');
  if (acc === 'transferir') abrirCierre(s, 'T');
  if (acc === 'recibir') abrirCierre(s, 'B');
  if (acc === 'entregar') abrirCierre(s, 'E');
}

async function aceptar(lista){

  for (const s of lista){
    if (s.estado !== 'Pendiente' || rolB(s) || S.cola.some(j => j.id === s.id && j.tipo === 'aceptar')) continue;

/* ───────────── Navegación con Google Maps ───────────── */
function puntoTxt(lat, lng, dir, ciudad){ return (lat && lng) ? lat + ',' + lng : (dir ? dir + ', ' + (ciudad || 'Bogotá') : null); }
function navegarServicio(s){
  const p = paso(s);
  const dest = (p === 'recoger' || p === 'aceptar') && tieneOrigen(s) ? puntoTxt(s.latO, s.lngO, s.dirOrigen || s.sedeOrigen, s.ciudad)
    : (p === 'transferir' || p === 'recibir' || p === 'esperar') ? (s.punto ? puntoTxt(s.punto.lat, s.punto.lng, s.punto.dir, s.ciudad) : null)
    : puntoTxt(s.lat, s.lng, s.direccion, s.ciudad);
  if (!dest){ toast('Este pedido no tiene dirección'); return; }
  abrirMaps([dest]);
}
function abrirMaps(puntos){
  const dest = puntos[puntos.length-1], wps = puntos.slice(0,-1);
  let url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(dest);
  if (wps.length) url += '&waypoints=' + encodeURIComponent(wps.join('|'));
  window.open(url, '_blank');
}
$('#btnNavegar').onclick = () => {

function cambiarVista(v){

    if (!S.mapa){

      S.mapa = L.map('mapa', {zoomControl:false}).setView(med ? [6.24, -75.58] : [4.68, -74.07], 12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(S.mapa);
      L.control.zoom({position:'topright'}).addTo(S.mapa);
      S.capa = L.layerGroup().addTo(S.mapa);
    }
    setTimeout(() => { S.mapa.invalidateSize(); pintarMapa(true); }, 60);
    ubicar();
  }
}
let yoMarker = null;
function pintarYo(){
  if (!S.pos || !S.mapa) return;
  if (!yoMarker) yoMarker = L.marker([S.pos.lat, S.pos.lng], {icon: L.divIcon({className:'', html:'<div class="yo"></div>', iconSize:[18,18]}), zIndexOffset:1000}).addTo(S.mapa);
  else yoMarker.setLatLng([S.pos.lat, S.pos.lng]);
}
function pintarMapa(encuadrar){
  if (!S.mapa || !S.plan) return;
  S.capa.clearLayers();
  const limites = [];
  const colorP = (items) => items.some(x => x.prio === 'Alta') ? '#D93025' : items.some(x => x.prio === 'Media') ? '#F29900' : '#1A73E8';
  // Cerrados hoy, tenues en su destino
  serviciosVisibles().filter(s => !abierto(s) && s.lat && s.lng).forEach(s => {
    L.marker([s.lat, s.lng], {opacity:.5, icon: L.divIcon({className:'', iconSize:[24,24], iconAnchor:[12,24],
      html:`<div class="pin" style="width:24px;height:24px;background:${s.estado === 'Entregado' ? '#1E8E3E' : '#D93025'}"><span style="color:#fff;font-size:11px">${s.estado === 'Entregado' ? '✓' : '!'}</span></div>`})})
      .bindPopup(`<b>${esc(s.sedeDestino || s.id)}</b><br><small>${esc(s.estado)} ${s.horaCierre || s.horaTransferido || ''}</small>`).addTo(S.capa);
  });
  S.plan.paradas.forEach(pa => {
    const clase = pa.tipos.has('T') || pa.tipos.has('B') ? 't' : pa.tipos.size > 1 ? 'x' : pa.tipos.has('R') ? 'r' : 'e';
    const icon = L.divIcon({className:'', iconSize:[32,32], iconAnchor:[16,32], popupAnchor:[0,-30],
      html:`<div class="pin ${clase}" style="border-color:${colorP(pa.items)}"><span>${pa.n}</span></div>`});
    const items = pa.items.map(it => {
      const s = it.s, p = paso(s);
      const btn = p === 'aceptar' ? `<button onclick="accionMapa('aceptar','${esc(s.id)}')">Aceptar</button>`
        : (it.tipo === 'R' && p === 'recoger') ? `<button onclick="accionMapa('recoger','${esc(s.id)}')">Recoger</button>`
        : (it.tipo === 'T' && p === 'transferir') ? `<button onclick="accionMapa('transferir','${esc(s.id)}')">Entregué al compañero</button>`
        : (it.tipo === 'B' && p === 'recibir') ? `<button onclick="accionMapa('recibir','${esc(s.id)}')">Recibí</button>`
        : (it.tipo === 'E' && p === 'entregar') ? `<button onclick="accionMapa('entregar','${esc(s.id)}')">Entregar</button>` : '';
      const tit = {R: '↑ <b>Recoger en tienda</b>', T: '⇄ <b>Entregar a ' + esc(s.otro) + '</b>', B: '⇄ <b>Recibir de ' + esc(s.otro) + '</b>', E: '↓ <b>Entregar al cliente</b>'}[it.tipo];
      return `<div class="pop-item">${tit} · #${esc(s.solicitud || s.id)}${it.tipo === 'T' || it.tipo === 'B' ? (s.horaTrueque ? ' · ' + esc(s.horaTrueque) : '') : s.hasta ? ' · hasta ' + s.hasta : ''}<br>
        <small>${it.tipo === 'E' ? esc(s.sedeDestino || '') : 'Cliente: ' + esc(s.sedeDestino || s.direccion)}</small>${btn}</div>`;
    }).join('');
    L.marker([pa.lat, pa.lng], {icon, zIndexOffset: 500 - pa.n}).addTo(S.capa)
      .bindPopup(`<b>${pa.n}. ${esc(pa.nombre || '')}</b><br><small>${esc(pa.dir || '')}${pa.dir ? '<br>' : ''}Llegada estimada ${aHora(pa.eta)}</small>${items}`, {maxWidth: 260});
    limites.push([pa.lat, pa.lng]);
  });
  const linea = S.plan.paradas.map(pa => [pa.lat, pa.lng]);
  if (S.pos) linea.unshift([S.pos.lat, S.pos.lng]);
  if (linea.length > 1) L.polyline(linea, {color:'#111', weight:3, opacity:.6, dashArray:'6 8'}).addTo(S.capa);
  pintarYo();
  if (encuadrar){
    if (S.pos) limites.push([S.pos.lat, S.pos.lng]);
    if (limites.length > 1) S.mapa.fitBounds(limites, {padding:[50,50], maxZoom:16});
    else if (limites.length === 1) S.mapa.setView(limites[0], 15);
    if (S.plan.sinUbic.length) toast(S.plan.sinUbic.length + ' pedido(s) sin ubicación: revisa la lista');
  }
}

function comprimir(file){
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, FOTO_LADO / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      // Sello: fecha, hora, etapa e ID del servicio
      // Sello: fecha y hora · etapa · N° de solicitud del cliente (o ruta fija) · ID interno
      const sv = S.cierre.s, sol = String(sv.solicitud || '').trim();
      const ref = sol ? 'PEDIDO ' + sol + ' · ' + sv.id : sv.id;
      const etiqueta = S.cierre.resultado === 'Novedad' ? 'NOVEDAD' : {R: 'RECOGIDA', T: 'TRASPASO A ' + String(sv.otro || '').toUpperCase(), B: 'RECIBIDO', E: 'ENTREGA'}[S.cierre.etapa];
      const sello = new Date().toLocaleString('es-CO') + ' · ' + etiqueta + ' · ' + ref;
      let fs = Math.max(14, Math.round(c.width / 45));
      g.font = `bold ${fs}px sans-serif`;
      while (fs > 10 && g.measureText(sello).width + fs > c.width){ fs--; g.font = `bold ${fs}px sans-serif`; }
      const w = g.measureText(sello).width + fs;
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, c.height - fs*1.8, w, fs*1.8);
      g.fillStyle = '#FFD200'; g.fillText(sello, fs/2, c.height - fs*0.55);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', FOTO_CALIDAD));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}

function posicionActual(){
  return new Promise(ok => {
    if (!navigator.geolocation) return ok(S.pos);
    navigator.geolocation.getCurrentPosition(p => { S.pos = {lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}; S.prec = p.coords.accuracy; ok(S.pos); },
      () => ok(S.pos), {enableHighAccuracy:true, timeout:8000, maximumAge:30000});
  });
}

$('#btnConfirmar').onclick = async () => {

};

/* ───────────── Cola de envío (funciona sin señal, en orden) ───────────── */
async function procesarCola(){
  try { S.cola = (await DB.todos()).sort((a,b) => a.creado - b.creado); } catch(e){}
  pintarSync();
  if (S.sincronizando || !S.sesion || !S.cola.length) return;
  S.sincronizando = true; pintarSync();
  const bloqueados = new Set();   // si un evento de un servicio falla, los siguientes del mismo servicio esperan
  try {
    for (const job of S.cola.slice()){
      if (job.error || bloqueados.has(job.id)){ bloqueados.add(job.id); continue; }
      try {
        for (let i = 0; i < job.fotos.length; i++){
          if (job.subidas[i]) continue;
          await api('subirFoto', {id: job.id, etapa: job.etapaFotos, lote: job.jobId, idx: i, data: job.fotos[i]});
          job.subidas[i] = true; await DB.poner(job);
        }
        const base = {id: job.id, hora: job.hora, lat: job.lat, lng: job.lng};
        if (job.tipo === 'turno'){
          const r = await api('turno', {tipo: job.accion, evento: job.jobId, hora: job.hora, lat: job.lat, lng: job.lng, precision: job.precision, foto: job.foto, nota: job.nota});
          await DB.quitar(job.jobId);
          S.cola = S.cola.filter(j => j.jobId !== job.jobId);
          if (r.turno){ S.turnoSrv = r.turno; ls.set('cv_turno', S.turnoSrv); }
          if (r.resumen) toast('Turno cerrado: ' + r.resumen.horas + ' h trabajadas · ' + (r.resumen.servicios || 0) + ' servicios cerrados');
          continue;
        }
        if (job.tipo === 'aceptar') await api('aceptar', base);
        else if (job.tipo === 'recoger') await api('recoger', Object.assign(base, {persona: job.persona, observacion: job.observacion}));
        else if (job.tipo === 'transferir') await api('transferir', Object.assign(base, {persona: job.persona, observacion: job.observacion}));
        else if (job.tipo === 'recibir') await api('recibir', Object.assign(base, {observacion: job.observacion}));
        else await api('cerrar', Object.assign(base, {estado: job.estado, motivo: job.motivo, persona: job.persona, observacion: job.observacion}));
        await DB.quitar(job.jobId);
        S.cola = S.cola.filter(j => j.jobId !== job.jobId);
        const s = S.servicios.find(x => x.id === job.id);
        if (s){
          const h = hhmm(job.hora);
          if (job.tipo === 'aceptar' && s.estado === 'Pendiente'){ s.estado = 'Aceptado'; s.horaAceptado = s.horaAceptado || h; }
          if (job.tipo === 'recoger'){ s.estado = 'Recogido'; s.horaAceptado = s.horaAceptado || h; s.horaRecogido = h; s.entregaOrigen = job.persona; }
          if (job.tipo === 'transferir' && !['Recibido','Entregado','Novedad'].includes(s.estado)){ s.estado = 'Transferido'; s.horaTransferido = h; }
          if (job.tipo === 'recibir'){ s.estado = 'Recibido'; s.horaRecibido = h; }
          if (job.tipo === 'cerrar'){ s.estado = job.estado; s.horaAceptado = s.horaAceptado || h; s.horaCierre = h; s.recibe = job.persona; s.motivo = job.motivo; }
          if (!S.fecha) ls.set('cv_servicios', S.servicios);
        }
      } catch(e){
        if (e.red){ estadoRed(false); break; }
        job.error = e.message; await DB.poner(job); bloqueados.add(job.id);
      }
    }
  } finally { S.sincronizando = false; render(); }
}
function pintarSync(){
  const b = $('#syncBadge'); const n = S.cola.length, errs = S.cola.filter(j => j.error).length;
  b.className = '';
  if (errs){ b.classList.add('err'); b.textContent = errs + ' con error'; }
  else if (S.sincronizando){ b.classList.add('pend'); b.textContent = 'Enviando ' + n + '…'; }
  else if (n){ b.classList.add('pend'); b.textContent = n + ' sin enviar'; }
  else b.textContent = enLinea ? 'En línea' : 'Sin señal';
}
const TIPO_TXT = {aceptar: 'aceptación', recoger: 'recogida', transferir: 'entrega al compañero', recibir: 'recepción', cerrar: 'entrega', turno: 'registro de turno'};
function pintarCola(){
  const errs = S.cola.filter(j => j.error);
  $('#colaBox').innerHTML = errs.map(j => `<div class="cola-item"><b>No se pudo enviar ${j.tipo === 'turno' ? 'el registro de turno (' + esc(j.accion) + ')' : 'la ' + (TIPO_TXT[j.tipo] || 'acción') + ' de ' + esc(j.id)}</b><br>${esc(j.error)}
    <div class="fila-btn"><button style="background:#fff" data-reint="${j.jobId}">Reintentar</button><button style="background:var(--rojo);color:#fff" data-desc="${j.jobId}">Descartar</button></div></div>`).join('');
}
$('#colaBox').addEventListener('click', async e => {
  const r = e.target.closest('[data-reint]'), d = e.target.closest('[data-desc]');
  if (r){ const j = S.cola.find(x => x.jobId === r.dataset.reint); if (j){ j.error = null; await DB.poner(j); procesarCola(); } }
  if (d && confirm('Se descartará este registro y sus fotos. Avisa a tu coordinador. ¿Continuar?')){ await DB.quitar(d.dataset.desc); procesarCola(); }
});

/* ───────────── Filtro de fecha ─────────────
   Por defecto se ve HOY. Se puede elegir otro día o "Todos los activos" (de cualquier fecha). */
function sumarDias(n){ const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function etiquetaFecha(f){
  if (!f) return 'Hoy';
  if (f === 'activos') return 'Todos activos';
  if (f === sumarDias(-1)) return 'Ayer';
  if (f === sumarDias(1)) return 'Mañana';
  if (f === hoyTxt()) return 'Hoy';
  const d = new Date(f + 'T12:00:00');
  return d.toLocaleDateString('es-CO', {weekday:'short', day:'numeric', month:'short'}).replace('.', '');
}
function pintarFecha(){
  const b = $('#btnFecha'); if (!b) return;
  b.textContent = '📅 ' + etiquetaFecha(S.fecha) + ' ▾';
  b.classList.toggle('otro', !!S.fecha && S.fecha !== hoyTxt());
  const av = $('#avisoOtros');
  const mostrar = S.otros > 0 && S.fecha !== 'activos';
  av.classList.toggle('oculto', !mostrar);
  if (mostrar) av.innerHTML = `<span>⚠ Tienes <b>${S.otros}</b> pedido(s) activo(s) de otros días</span><button id="verActivos">Ver</button>`;
  const va = $('#verActivos'); if (va) va.onclick = () => elegirFecha('activos');
}
function elegirFecha(f){
  if (f === hoyTxt()) f = '';
  $('#menuFecha').classList.add('oculto');
  if (f === S.fecha) return;
  S.fecha = f; S.servicios = f ? [] : ls.get('cv_servicios', []); S.idsVistos = null; S.abierto = null; S.otros = 0;
  render(); if (S.mapa && S.vista === 'mapa') pintarMapa(true);
  cargar(false);
}

$('#menuFecha').addEventListener('click', e => {
