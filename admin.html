  for (let i = 0; i < 3; i++){ const x = Object.assign({}, pedidos[i], {id: 'CV' + String(150 + i).padStart(4, '0'), pedido: 'VEL-' + (21500 + i), A: '', B: '', publicado: false, modalidad: '', punto: '', horaTrueque: '', asignacion: '', motivoAsig: '', estado: 'Pendiente', hAceptado: '', hRecogido: '', hTransferido: '', hRecibido: '', hCierre: '', conFotos: false, nFotos: {R: 0, T: 0, E: 0}}); pedidos.push(x); }
}
function demoEntrada(fecha, ciudad, asignar){
  const DB = DEMO_DB, m = fecha === hoyTxt() ? ahoraMin() : 0;
  const ps = DB.pedidos.filter(p => p.fecha === fecha && (ciudad === 'Todas' || p.ciudad === ciudad));
  return {ps, E: {ahoraMin: m, asignar, zonas: DB.zonas, puntos: DB.puntos,
    mensajeros: DB.mensajeros.filter(x => ciudad === 'Todas' || x.ciudad === ciudad).map(x => ({nombre: x.nombre, ciudad: x.ciudad, inicio: x.lat ? {lat: x.lat, lng: x.lng} : null, hora0: Math.max(m, 480)})),
    pedidos: ps.map(p => ({id: p.id, ciudad: p.ciudad, prio: p.prioridad, desde: aMin(p.desde), hasta: aMin(p.hasta), t: {lat: p.latO, lng: p.lngO}, d: p.lat ? {lat: p.lat, lng: p.lng} : null,
      estado: p.estado, intermunicipal: p.modalidad === 'Intermunicipal', A: p.A, B: p.B, fijo: p.asignacion === 'Manual', punto: p.punto, horaTrueque: aMin(p.horaTrueque)}))}};
}
function demoGenerar(fecha, ciudad){
  const {ps, E} = demoEntrada(fecha, ciudad, true);
  const R = motorRuteo_(E);
  const res = {pedidos: 0, directos: 0, trueques: 0, cambios: 0, intermunicipales: 0, sinAsignar: 0};
  ps.forEach(p => {
    const o = R.pedidos[p.id]; if (!o) return; res.pedidos++;
    const reasig = p.asignacion !== 'Manual' && p.estado === 'Pendiente' && o.modalidad !== 'Intermunicipal';
    if (reasig){
      const antes = [p.A, p.B, p.punto].join('|');
      p.A = o.A; p.B = o.modalidad === 'Trueque' ? o.B : ''; p.punto = o.modalidad === 'Trueque' ? o.punto : ''; p.asignacion = o.A ? 'Auto' : '';
      if ([p.A, p.B, p.punto].join('|') !== antes){ p.publicado = false; res.cambios++; }
      p.horaTrueque = o.modalidad === 'Trueque' ? hhmmMin_(o.horaTrueque) : '';
      p.motivoAsig = o.motivo;
    }
    if (o.modalidad) p.modalidad = o.modalidad;
    p.zonaO = o.zonaO; p.zonaD = o.zonaD; p.etaR = hhmmMin_(o.etaR); p.etaE = hhmmMin_(o.etaE); p.orden = o.orden;
    if (o.modalidad === 'Trueque') res.trueques++; else if (o.modalidad === 'Directo') res.directos++; else if (o.modalidad === 'Intermunicipal') res.intermunicipales++;
    if (!o.A && o.modalidad !== 'Intermunicipal') res.sinAsignar++;
  });
  return {resumen: res, avisos: R.avisos};
}
function demoApi(accion, d){
  return new Promise((ok, mal) => setTimeout(() => {
    try {
      if (!DEMO_DB) demoInit();
      const DB = DEMO_DB, err = (t) => mal(new Error(t));
      const usuarios = {OPERACION: {nombre: 'Coordinación Quick (demo)', perfil: 'Operación'}, VELEZ: {nombre: 'Cueros Vélez (demo)', perfil: 'Cliente'}};
      const ses = S.ses || {};
      if (accion !== 'admLogin' && accion !== 'admTablero' && accion !== 'admFotos' && accion !== 'admFoto' && ses.perfil !== 'Operación') return err('Tu perfil es de consulta: no puede modificar el ruteo.');
      switch (accion){
        case 'admLogin': { const u = usuarios[d.usuario]; if (!u || d.pin !== '1234') return err('En demo: usuario OPERACION o VELEZ, PIN 1234'); return ok({ok: true, token: 'demo', nombre: u.nombre, perfil: u.perfil, ciudad: 'Todas', ciudades: ['Bogotá', 'Medellín']}); }
        case 'admTablero': {
          const fecha = d.fecha || hoyTxt(), ciudad = d.ciudad || 'Todas', op = ses.perfil === 'Operación';
          const {ps, E} = demoEntrada(fecha, ciudad, false);
          const R = motorRuteo_(E);
          const pedidos = JSON.parse(JSON.stringify(ps)).map(p => { const r = R.pedidos[p.id]; if (r){ p.etaRcalc = hhmmMin_(r.etaR); p.etaEcalc = hhmmMin_(r.etaE); p.riesgo = r.riesgo; if (!p.zonaO) p.zonaO = r.zonaO; if (!p.zonaD) p.zonaD = r.zonaD; if (p.modalidad === 'Trueque' && !p.horaTrueque) p.horaTrueque = hhmmMin_(r.horaTrueque); } if (!op) delete p.telefono; return p; });
          const rutas = {};
          Object.keys(R.rutas).forEach(n => { const r = R.rutas[n]; rutas[n] = {ciudad: r.ciudad, inicio: op ? r.inicio : null, hora0: hhmmMin_(r.hora0), fin: hhmmMin_(r.fin), carga: r.carga, paradas: r.paradas.map(p => ({n: p.n, lat: p.lat, lng: p.lng, eta: hhmmMin_(p.eta), items: p.items}))}; });
          const fc = (x) => ciudad === 'Todas' || x.ciudad === ciudad;
          const m = fecha === hoyTxt() ? ahoraMin() : (fecha < hoyTxt() ? 1440 : -1);
          const alertas = R.avisos.slice();
          pedidos.forEach(p => {
            if (!abiertoP(p)) return;
            const hT = aMin(p.horaTrueque);
            if (p.modalidad === 'Trueque' && hT != null && ['Pendiente', 'Aceptado', 'Recogido'].includes(p.estado) && m > hT + 20) alertas.push({tipo: 'truequeRiesgo', id: p.id, txt: 'Trueque atrasado: debía hacerse a las ' + p.horaTrueque + ' (' + p.A + ' → ' + p.B + ')'});
            const h = aMin(p.hasta); if (h != null && m > h) alertas.push({tipo: 'vencido', id: p.id, txt: 'Vencido: hora límite ' + p.hasta});
            if (op && p.A && !p.publicado) alertas.push({tipo: 'borrador', id: p.id, txt: 'Asignado sin publicar'});
          });
          return ok({ok: true, fecha, ciudad, perfil: ses.perfil, nombre: ses.nombre, pedidos, rutas, hora: new Date().toTimeString().slice(0, 5),
            mensajeros: DB.mensajeros.filter(fc).map(x => { const y = Object.assign({}, x); if (!op){ delete y.lat; delete y.lng; delete y.telefono; delete y.codigo; } else if (y.lat) y.horaUbic = fecha + ' ' + new Date().toTimeString().slice(0, 5); return y; }),
            zonas: DB.zonas.filter(fc), puntos: DB.puntos.filter(fc), tiendas: DB.tiendas.filter(fc),
            alertas: alertas.filter(a => op || !['borrador', 'mensajero', 'sinAsignar', 'sinMensajero', 'punto'].includes(a.tipo))});
        }
        case 'admGenerar': { const r = demoGenerar(d.fecha || hoyTxt(), d.ciudad || 'Todas'); return ok({ok: true, resumen: r.resumen, avisos: r.avisos}); }
        case 'admPublicar': { let n = 0; DB.pedidos.forEach(p => { if (p.fecha === d.fecha && (d.ciudad === 'Todas' || p.ciudad === d.ciudad) && p.A && abiertoP(p) && !p.publicado){ p.publicado = true; n++; } }); return ok({ok: true, publicados: n}); }
        case 'admMover': {
          const p = DB.pedidos.find(x => x.id === d.id); if (!p) return err('Pedido no encontrado');
          const tq = d.B && d.B !== d.A;
          if (['Recogido', 'Transferido', 'Recibido'].includes(p.estado) && d.A !== p.A) return err('El pedido ya fue recogido: no se puede cambiar quién lo recoge');
          Object.assign(p, {A: d.A, B: tq ? d.B : '', punto: tq ? d.punto : '', horaTrueque: tq ? d.horaTrueque || '' : '', modalidad: p.modalidad === 'Intermunicipal' ? 'Intermunicipal' : tq ? 'Trueque' : 'Directo', asignacion: d.A ? 'Manual' : '', motivoAsig: 'Ajuste manual · demo'});
          if (tq && !p.horaTrueque){ const {E} = demoEntrada(p.fecha, p.ciudad, false); const R = motorRuteo_(E); p.horaTrueque = hhmmMin_(R.pedidos[p.id].horaTrueque); }
          return ok({ok: true});
        }
        case 'admPasarDirecto': { const p = DB.pedidos.find(x => x.id === d.id); if (['Transferido', 'Recibido'].includes(p.estado)) return err('Ya transferido'); Object.assign(p, {B: '', punto: '', horaTrueque: '', modalidad: 'Directo', asignacion: 'Manual', motivoAsig: 'Trueque cancelado · entrega directa'}); return ok({ok: true}); }
        case 'admCancelar': { const p = DB.pedidos.find(x => x.id === d.id); p.estado = 'Cancelado'; p.observacion = 'Cancelado: ' + (d.motivo || ''); p.hCierre = new Date().toTimeString().slice(0, 5); return ok({ok: true}); }
        case 'admGuardarZona': { const z = d.zona; const i = DB.zonas.findIndex(x => x.nombre === (z.nombreAnterior || z.nombre) && x.ciudad === z.ciudad); const nueva = {nombre: z.nombre, ciudad: z.ciudad, mensajero: z.mensajero, color: z.color, poligono: z.poligono}; if (i >= 0) DB.zonas[i] = nueva; else DB.zonas.push(nueva); return ok({ok: true}); }
        case 'admBorrarZona': DB.zonas = DB.zonas.filter(x => !(x.nombre === d.nombre && x.ciudad === d.ciudad)); return ok({ok: true});
        case 'admGuardarPunto': { const q = d.punto; const i = DB.puntos.findIndex(x => x.nombre === (q.nombreAnterior || q.nombre) && x.ciudad === q.ciudad); const nuevo = {nombre: q.nombre, ciudad: q.ciudad, dir: q.dir, lat: q.lat, lng: q.lng, zonas: q.zonas, notas: q.notas}; if (i >= 0) DB.puntos[i] = nuevo; else DB.puntos.push(nuevo); return ok({ok: true}); }
        case 'admBorrarPunto': DB.puntos = DB.puntos.filter(x => !(x.nombre === d.nombre && x.ciudad === d.ciudad)); return ok({ok: true});
        case 'admFotos': { const p = DB.pedidos.find(x => x.id === d.id); const f = {R: [], T: [], B: [], E: []}; if (p && p.conFotos){ for (let i = 0; i < p.nFotos.R; i++) f.R.push(p.id + '_R_' + i); for (let i = 0; i < p.nFotos.T; i++) f.T.push(p.id + '_T_' + i); for (let i = 0; i < p.nFotos.E; i++) f.E.push(p.id + '_E_' + i); } return ok({ok: true, fotos: f}); }
        case 'admFoto': {
          const c = document.createElement('canvas'); c.width = 480; c.height = 360; const g = c.getContext('2d');
          g.fillStyle = '#e9e7e1'; g.fillRect(0, 0, 480, 360); g.fillStyle = '#111'; g.font = 'bold 22px sans-serif'; g.fillText('Foto de ejemplo', 150, 170);
          g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 320, 480, 40); g.fillStyle = '#FFD200'; g.font = 'bold 15px sans-serif'; g.fillText(d.nombre, 12, 345);
          return ok({ok: true, data: c.toDataURL('image/jpeg', .7)});
        }
      }
      ok({ok: true});
    } catch(e){ mal(e); }
  }, 250));
}
