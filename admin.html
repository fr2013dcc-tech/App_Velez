<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Plataforma Quick Ruteo · Cueros Vélez</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --amarillo:#FFD200; --amarillo-osc:#E6BD00; --negro:#111111; --negro-2:#1E1E1E; --gris:#6B6B6B;
  --gris-cl:#F2F2F0; --borde:#E2E2DE; --blanco:#FFFFFF;
  --rojo:#D93025; --verde:#1E8E3E; --naranja:#F29900; --azul:#1A73E8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--gris-cl);color:var(--negro);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.oculto{display:none!important}
.rayo{width:34px;height:34px;border-radius:9px;background:var(--amarillo);display:grid;place-items:center;flex:none}

/* Login */
#login{min-height:100%;display:grid;place-items:center;background:var(--negro);padding:24px}
.login-caja{width:100%;max-width:380px;color:#fff}
.login-caja .marca{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.login-caja .marca b{font-size:26px;letter-spacing:.4px} .login-caja .marca b span{color:var(--amarillo)}
.login-caja p{color:#bdbdbd;margin:0 0 26px}
.login-caja label{display:block;font-size:13px;color:#bdbdbd;margin-bottom:6px}
.login-caja input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:var(--negro-2);color:#fff;font-size:17px;outline:none;margin-bottom:14px}
.login-caja input:focus{border-color:var(--amarillo)}
.btn-pri{padding:11px 16px;border-radius:10px;background:var(--amarillo);color:var(--negro);font-weight:800}
.btn-pri:hover{background:var(--amarillo-osc)} .btn-pri:disabled{opacity:.5;cursor:default}
.btn-neg{padding:10px 14px;border-radius:10px;background:var(--negro);color:var(--amarillo);font-weight:800}
.btn-sec{padding:10px 14px;border-radius:10px;background:var(--gris-cl);font-weight:700;border:1px solid var(--borde)}
.btn-rojo{padding:10px 14px;border-radius:10px;background:#FDE7E7;color:var(--rojo);font-weight:800}
.login-caja .btn-pri{width:100%;padding:14px;font-size:16px}
#loginError{color:#ff8a80;min-height:22px;margin-top:10px}

/* App */
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--negro);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header .tit{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
header .tit b{font-size:17px;white-space:nowrap} header .tit b span{color:var(--amarillo)}
header .tit small{color:#bdbdbd;display:block;font-size:12px}
.ctl{display:flex;align-items:center;gap:6px}
.ctl input[type=date]{background:var(--negro-2);border:1px solid #333;border-radius:9px;color:#fff;padding:7px 9px;color-scheme:dark}
.ctl .chipd{padding:7px 11px;border-radius:9px;background:var(--negro-2);color:#ddd;font-weight:700;font-size:13px;white-space:nowrap}
.ctl .chipd.act{background:var(--amarillo);color:var(--negro)}
.usuario{display:flex;align-items:center;gap:8px;font-size:13px;color:#ddd}
.usuario .perf{padding:3px 8px;border-radius:99px;background:#2a2a2a;font-weight:800;font-size:11px;letter-spacing:.3px;text-transform:uppercase}
.usuario .perf.op{background:var(--amarillo);color:var(--negro)}
.usuario button{color:#bdbdbd;text-decoration:underline}
#demoBanner{background:var(--amarillo);color:var(--negro);text-align:center;font-size:12px;font-weight:800;padding:3px}
.cuerpo{flex:1;display:flex;min-height:0}
aside{width:440px;max-width:100%;background:#fff;display:flex;flex-direction:column;border-right:1px solid var(--borde);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--borde);background:#fff;flex:none}
.tabs button{flex:1;padding:12px 4px;font-weight:700;color:var(--gris);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.act{color:var(--negro);border-color:var(--amarillo)}
.panel{flex:1;overflow:auto;padding:14px}
#mapaBox{flex:1;position:relative;min-width:0}
#mapa{position:absolute;inset:0;background:#e5e3df}
.capas{position:absolute;top:10px;left:50px;z-index:500;background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:6px 8px;display:flex;gap:10px;font-size:12.5px;flex-wrap:wrap}
.capas label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
.aviso-mapa{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:600;background:var(--negro);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center}
.aviso-mapa button{background:var(--amarillo);color:var(--negro);font-weight:800;padding:6px 10px;border-radius:8px}
.aviso-mapa button.sec{background:#333;color:#fff}

/* Bloques del panel */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--gris-cl);border-radius:10px;padding:8px 10px;border-top:3px solid var(--amarillo)}
.kpi b{display:block;font-size:20px} .kpi small{color:var(--gris);font-size:11.5px;line-height:1.2;display:block}
.acciones-ruteo{display:flex;gap:8px;margin-bottom:12px}
.acciones-ruteo button{flex:1}
.nota{font-size:12.5px;color:var(--gris);margin:-4px 0 12px}
.sec-tit{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--gris);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec-tit .lin{flex:1;height:1px;background:var(--borde)}
.avisos{border-radius:10px;background:#FFF4E5;padding:8px 10px;font-size:13px;color:#7a4b00;margin-bottom:10px}
.avisos details summary{cursor:pointer;font-weight:700}
.avisos ul{margin:6px 0 0;padding-left:18px} .avisos li{margin-bottom:3px}
.avisos a{color:#7a4b00;font-weight:700;cursor:pointer}
.alerta-roja{background:#FDE7E7;color:#8c1d16}
.mens{border:1px solid var(--borde);border-radius:12px;margin-bottom:8px;overflow:hidden}
.mens.sel{border-color:var(--negro);box-shadow:0 0 0 2px var(--amarillo)}
.mens-cab{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.mens-cab .nom{flex:1;min-width:0}
.mens-cab .nom b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mens-cab .nom small{color:var(--gris)}
.barra{height:6px;border-radius:9px;background:var(--gris-cl);margin-top:5px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--negro);border-radius:9px}
.barra i.alta{background:var(--rojo)}
.carga{text-align:right;font-size:12px;color:var(--gris);white-space:nowrap}
.carga b{display:block;color:var(--negro);font-size:15px}
.paradas{border-top:1px solid var(--borde);background:#FAFAF8;padding:6px 12px 8px}
.parada{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--borde);cursor:pointer}
.parada:last-child{border-bottom:0}
.parada .n{width:22px;height:22px;border-radius:50%;background:var(--negro);color:var(--amarillo);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.parada .h{width:44px;color:var(--gris);font-variant-numeric:tabular-nums;flex:none;padding-top:2px}
.parada .t{flex:1;min-width:0}
.ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:11px;font-weight:800;margin-right:4px;vertical-align:-3px}
.ic.R{background:var(--amarillo)} .ic.E{background:var(--negro);color:var(--amarillo)} .ic.T,.ic.B{background:var(--azul);color:#fff}
.etq{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--gris-cl);white-space:nowrap}
.etq.tq{background:var(--azul);color:#fff} .etq.borr{background:#FFF6CC;color:#6B5600} .etq.man{background:#EDE7F6;color:#4527a0}
.etq.e-Pendiente{background:var(--gris-cl);color:#444} .etq.e-Aceptado{background:#FFF6CC;color:#6B5600} .etq.e-Recogido{background:var(--amarillo)}
.etq.e-Transferido,.etq.e-Recibido{background:#E3F2FD;color:#0b3a8c} .etq.e-Entregado{background:#E6F4EA;color:var(--verde)}
.etq.e-Novedad,.etq.e-Cancelado{background:#FDE7E7;color:var(--rojo)} .etq.riesgo{background:var(--rojo);color:#fff}
.vacio{text-align:center;color:var(--gris);padding:28px 10px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 11px;border-radius:99px;background:#fff;border:1px solid var(--borde);font-size:13px;font-weight:600}
.chip.act{background:var(--negro);color:#fff;border-color:var(--negro)}
.buscar{display:flex;gap:6px;margin-bottom:10px}
.buscar input,.buscar select{flex:1;min-width:0;padding:9px 10px;border-radius:9px;border:1px solid var(--borde);background:#fff}
.ped{display:flex;gap:10px;padding:9px 6px;border-bottom:1px solid var(--borde);cursor:pointer;align-items:flex-start}
.ped:hover{background:#FAFAF8}
.sem{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.ped .c{flex:1;min-width:0}
.ped .c b{font-size:14px} .ped .c small{display:block;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped .d{text-align:right;font-size:12px;color:var(--gris);white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
table.t th{text-align:left;background:var(--negro);color:var(--amarillo);font-size:11px;padding:6px 8px;font-weight:800;letter-spacing:.3px}
table.t td{padding:6px 8px;border-bottom:1px solid var(--borde)} table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
table.t th.n{text-align:right}
.zona{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borde)}
.zona .nom{flex:1;min-width:0} .zona .nom small{display:block;color:var(--gris)}
.zona button{font-size:12.5px;font-weight:700;padding:5px 8px;border-radius:7px;background:var(--gris-cl)}
.zona button.rojo{color:var(--rojo)}
.form{background:var(--gris-cl);border-radius:12px;padding:12px;margin:10px 0}
.form label{display:block;font-size:12.5px;font-weight:700;margin:0 0 4px}
.form input,.form select,.form textarea{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--borde);background:#fff;margin-bottom:10px}
.form .fila{display:flex;gap:8px} .form .fila>*{flex:1}
.form .zonas-chk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:13px}
.form .zonas-chk label{display:flex;gap:4px;align-items:center;font-weight:600;margin:0}
.form .zonas-chk input{width:auto;margin:0}

/* Detalle de pedido */
#det{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1500;display:flex;justify-content:flex-end}
#det .hoja{width:520px;max-width:100%;height:100%;background:#fff;overflow:auto;padding:18px 18px 30px}
#det h2{margin:0;font-size:20px}
#det .sub{color:var(--gris);margin-bottom:12px}
#det .cerrar{float:right;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px;background:var(--gris-cl)}
.datos{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13.5px;margin-bottom:12px}
.datos dt{color:var(--gris)} .datos dd{margin:0}
.linea{position:relative;margin:6px 0 14px;padding-left:22px}
.linea:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--borde)}
.paso{position:relative;margin-bottom:10px;font-size:13.5px}
.paso:before{content:'';position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--borde)}
.paso.ok:before{background:var(--verde);border-color:var(--verde)} .paso.nov:before{background:var(--rojo);border-color:var(--rojo)}
.paso.tq:before{background:var(--azul);border-color:var(--azul)}
.paso b{display:block} .paso small{color:var(--gris)}
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.galeria .f{aspect-ratio:1;border-radius:10px;background:var(--gris-cl) center/cover;cursor:zoom-in;position:relative;display:grid;place-items:center;color:var(--gris);font-size:12px}
.galeria .f span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:grid;place-items:center;cursor:zoom-out}
#visor img{max-width:96vw;max-height:94vh;border-radius:8px}
.motivo{background:var(--gris-cl);border-radius:9px;padding:8px 10px;font-size:13px;margin-bottom:12px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--negro);color:#fff;padding:11px 16px;border-radius:12px;z-index:3000;max-width:90%;transition:transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.ver{transform:translateX(-50%) translateY(0)}
.spin{width:16px;height:16px;border:2.5px solid rgba(0,0,0,.2);border-top-color:var(--negro);border-radius:50%;animation:g .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes g{to{transform:rotate(360deg)}}

/* Marcadores */
.mk-t{width:22px;height:22px;border-radius:6px;background:var(--amarillo);border:2px solid var(--negro);display:grid;place-items:center;font-size:11px;font-weight:900}
.mk-p{width:22px;height:22px;transform:rotate(45deg);background:var(--azul);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mk-c{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk-n{width:20px;height:20px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:800;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mk-m{width:30px;height:30px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.mk-v{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--negro);cursor:move}
.zona-lbl{background:transparent;border:0;box-shadow:none;font-weight:800;font-size:12px;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff}
.zona-lbl:before{display:none}

@media (max-width: 900px){
  .cuerpo{flex-direction:column}
  aside{width:100%;border-right:0;max-height:none;flex:none}
  .panel{overflow:visible}
  #mapaBox{flex:none;height:70vh}
  .kpis{grid-template-columns:repeat(2,1fr)}
  header .tit small{display:none}
}
</style>
</head>
<body>

<section id="login" class="oculto">
  <div class="login-caja">
    <div class="marca"><div class="rayo"><svg width="18" height="22" viewBox="0 0 22 26"><path d="M13 0L0 15h8l-2 11L22 10h-9z" fill="#111"/></svg></div><b>QUICK <span>RUTEO</span></b></div>
    <p>Plataforma de ruteo y seguimiento · Cueros Vélez</p>
    <label for="inUsuario">Usuario</label><input id="inUsuario" autocomplete="username" autocapitalize="characters">
    <label for="inPin">PIN</label><input id="inPin" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="btn-pri" id="btnLogin">Ingresar</button>
    <div id="loginError"></div>
  </div>
</section>

<section id="app" class="oculto">
  <div id="demoBanner" class="oculto">MODO DEMO · datos ficticios, nada se guarda · usuario OPERACION o VELEZ, PIN 1234</div>
  <header>
    <div class="tit"><div class="rayo"><svg width="15" height="18" viewBox="0 0 22 26"><path d="M13 0L0 15h8l-2 11L22 10h-9z" fill="#111"/></svg></div>
      <div><b>QUICK <span>RUTEO</span> · Cueros Vélez</b><small id="hEstado">—</small></div></div>
    <div class="ctl"><button class="chipd" id="btnHoy">Hoy</button><input type="date" id="inFecha"></div>
    <div class="ctl" id="ciudades"></div>
    <div class="ctl"><button class="chipd" id="btnRefrescar" title="Actualizar">↻</button></div>
    <div class="usuario"><span id="hUsuario"></span><span class="perf" id="hPerfil"></span><button id="btnSalir">Salir</button></div>
  </header>
  <div class="cuerpo">
    <aside>
      <div class="tabs" id="tabs"></div>
      <div class="panel" id="panel"></div>
    </aside>
    <div id="mapaBox">
      <div id="mapa"></div>
      <div class="capas" id="capas"></div>
      <div class="aviso-mapa oculto" id="avisoMapa"></div>
    </div>
  </div>
</section>

<div id="det" class="oculto"><div class="hoja" id="detHoja"></div></div>
<div id="visor" class="oculto"><img id="visorImg" alt="Evidencia"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   QUICK RUTEO · Cueros Vélez — plataforma visual (operación y cliente) v1.0
   CONFIGURACIÓN: la MISMA URL /exec que usa la app del mensajero (index.html).
   Vacía (o ?demo=1) = modo demo con datos ficticios.
   ════════════════════════════════════════════════════════════════════ */
const API_URL = '';   // ← PEGA AQUÍ la URL /exec de Apps Script de Cueros Vélez
const DEMO = !API_URL || new URLSearchParams(location.search).has('demo');
const POLL_MS = 60000;
const COLORES = ['#E6194B', '#3CB44B', '#4363D8', '#F58231', '#911EB4', '#42D4F4', '#F032E6', '#9A6324', '#469990', '#808000'];
const CENTROS = {'Bogotá': [4.66, -74.08], 'Medellín': [6.235, -75.575], 'Todas': [4.66, -74.08]};

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function hoyTxt(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function aMin(h){ const m = String(h || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1]*60 + +m[2] : null; }
function ahoraMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }

const S = {
  ses: ls.get('cvadm_ses', null), fecha: hoyTxt(), ciudad: ls.get('cvadm_ciudad', 'Todas'), tab: ls.get('cvadm_tab', ''),
  D: null, cargando: false, selMens: null, capas: ls.get('cvadm_capas', {zonas: true, rutas: true, pedidos: true, mensajeros: true, puntos: true, tiendas: true}),
  filtro: {estado: 'activos', q: '', mens: ''}, edicion: null, mapa: null, grupos: null, abiertos: {}
};
const esOp = () => S.ses && S.ses.perfil === 'Operación';

/* ───────────── API ───────────── */
async function api(accion, datos){
  if (DEMO) return demoApi(accion, datos || {});
  const cuerpo = Object.assign({accion, token: S.ses && S.ses.token}, datos || {});
  let r;
  try { r = await fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(cuerpo), redirect: 'follow'}); }
  catch(e){ throw new Error('Sin conexión'); }
  if (!r.ok) throw new Error('Servidor no disponible (' + r.status + ')');
  const j = await r.json();
  if (!j.ok){ if (j.error === 'SESION') salir(true); throw new Error(j.mensaje || j.error || 'Error'); }
  return j;
}

/* ───────────── Sesión ───────────── */
function iniciar(){
  if (DEMO) $('#demoBanner').classList.remove('oculto');
  if (!S.ses){ $('#login').classList.remove('oculto'); $('#app').classList.add('oculto'); return; }
  $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
  $('#hUsuario').textContent = S.ses.nombre;
  $('#hPerfil').textContent = S.ses.perfil; $('#hPerfil').classList.toggle('op', esOp());
  const tabs = esOp() ? [['ruteo', 'Ruteo'], ['seguimiento', 'Seguimiento'], ['zonas', 'Zonas'], ['indicadores', 'Indicadores']]
                      : [['seguimiento', 'Seguimiento'], ['indicadores', 'Indicadores']];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  $('#tabs').innerHTML = tabs.map(([k, t]) => `<button data-tab="${k}">${t}</button>`).join('');
  const ciudades = S.ses.ciudad && S.ses.ciudad !== 'Todas' ? [S.ses.ciudad] : ['Todas'].concat(S.ses.ciudades || ['Bogotá', 'Medellín']);
  if (!ciudades.includes(S.ciudad)) S.ciudad = ciudades[0];
  $('#ciudades').innerHTML = ciudades.map(c => `<button class="chipd" data-ciudad="${esc(c)}">${esc(c)}</button>`).join('');
  $('#inFecha').value = S.fecha;
  iniciarMapa();
  pintarCapasCtl();
  cargar();
}
$('#btnLogin').onclick = async () => {
  const usuario = $('#inUsuario').value.trim().toUpperCase(), pin = $('#inPin').value.trim();
  $('#loginError').textContent = '';
  if (!usuario || !pin){ $('#loginError').textContent = 'Ingresa usuario y PIN'; return; }
  const b = $('#btnLogin'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    const r = await api('admLogin', {usuario, pin});
    S.ses = {token: r.token, nombre: r.nombre, perfil: r.perfil, ciudad: r.ciudad, ciudades: r.ciudades};
    ls.set('cvadm_ses', S.ses); iniciar();
  } catch(e){ $('#loginError').textContent = e.message; }
  finally { b.disabled = false; b.textContent = 'Ingresar'; }
};
$('#inPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });
function salir(vencida){
  S.ses = null; S.D = null; ls.del('cvadm_ses'); iniciar();
  if (vencida) $('#loginError').textContent = 'Tu sesión venció. Ingresa de nuevo.';
}
$('#btnSalir').onclick = () => salir(false);

/* ───────────── Carga ───────────── */
async function cargar(encuadrar){
  if (!S.ses || S.cargando) return;
  S.cargando = true; $('#btnRefrescar').innerHTML = '<span class="spin" style="border-top-color:#FFD200"></span>';
  try {
    const primera = !S.D;
    const r = await api('admTablero', {fecha: S.fecha, ciudad: S.ciudad});
    S.D = r; S.colores = coloresMens(r);
    $('#hEstado').textContent = (r.ciudad === 'Todas' ? 'Bogotá y Medellín' : r.ciudad) + ' · ' + fechaLarga(r.fecha) + ' · actualizado ' + r.hora;
    pintarTodo(primera || encuadrar);
  } catch(e){ toast(e.message); }
  finally { S.cargando = false; $('#btnRefrescar').textContent = '↻'; }
}
setInterval(() => { if (document.visibilityState === 'visible' && !S.edicion && $('#det').classList.contains('oculto')) cargar(); }, POLL_MS);
$('#btnRefrescar').onclick = () => cargar();
$('#inFecha').onchange = e => { if (e.target.value){ S.fecha = e.target.value; S.selMens = null; cargar(true); } };
$('#btnHoy').onclick = () => { S.fecha = hoyTxt(); $('#inFecha').value = S.fecha; cargar(true); };
$('#ciudades').addEventListener('click', e => { const b = e.target.closest('[data-ciudad]'); if (!b) return; S.ciudad = b.dataset.ciudad; ls.set('cvadm_ciudad', S.ciudad); S.selMens = null; cancelarEdicion(); cargar(true); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; ls.set('cvadm_tab', S.tab); cancelarEdicion(); pintarPanel(); pintarMapa(); });
function fechaLarga(f){ const d = new Date(f + 'T12:00:00'); return d.toLocaleDateString('es-CO', {weekday: 'long', day: 'numeric', month: 'long'}); }

/* Colores: el de la zona del mensajero; si no tiene zona, uno de la paleta */
function coloresMens(D){
  const c = {}; let k = 0;
  (D.zonas || []).forEach(z => { if (z.mensajero && !c[z.mensajero]) c[z.mensajero] = z.color || COLORES[k++ % COLORES.length]; });
  (D.mensajeros || []).forEach(m => { if (!c[m.nombre]) c[m.nombre] = COLORES[(k++) % COLORES.length]; });
  return c;
}
const colorDe = (n) => (S.colores && S.colores[n]) || '#555';
const iniciales = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();

/* ───────────── Pintado general ───────────── */
function pintarTodo(encuadrar){
  $$('#tabs button').forEach(b => b.classList.toggle('act', b.dataset.tab === S.tab));
  $$('#ciudades .chipd').forEach(b => b.classList.toggle('act', b.dataset.ciudad === S.ciudad));
  pintarPanel(); pintarMapa(encuadrar);
}
function pintarPanel(){
  $$('#tabs button').forEach(b => b.classList.toggle('act', b.dataset.tab === S.tab));
  const p = $('#panel');
  if (!S.D){ p.innerHTML = '<div class="vacio"><span class="spin"></span> Cargando…</div>'; return; }
  if (S.tab === 'ruteo') p.innerHTML = panelRuteo();
  else if (S.tab === 'seguimiento') p.innerHTML = panelSeguimiento();
  else if (S.tab === 'zonas') p.innerHTML = panelZonas();
  else p.innerHTML = panelIndicadores();
}
const abiertoP = (p) => ['Pendiente', 'Aceptado', 'Recogido', 'Transferido', 'Recibido'].includes(p.estado);
function semaforoP(p){
  if (p.estado === 'Entregado') return '#1E8E3E';
  if (p.estado === 'Novedad' || p.estado === 'Cancelado') return '#D93025';
  const h = aMin(p.hasta), hoy = S.fecha === hoyTxt();
  if (p.riesgo) return '#D93025';
  if (hoy && h != null){ const f = h - ahoraMin(); if (f < 0) return '#D93025'; if (f <= 30) return '#F29900'; }
  return p.estado === 'Pendiente' ? '#9E9E9E' : '#F2B600';
}
function etqEstado(p){ return `<span class="etq e-${esc(p.estado)}">${esc(p.estado)}</span>`; }
function quienTxt(p){ return p.A ? esc(p.A) + (p.modalidad === 'Trueque' && p.B ? ' → ' + esc(p.B) : '') : '<i style="color:var(--rojo)">sin asignar</i>'; }

/* ───────────── Panel RUTEO (operación) ───────────── */
function panelRuteo(){
  const D = S.D, ps = D.pedidos;
  const abiertos = ps.filter(abiertoP);
  const sinAsig = abiertos.filter(p => !p.A), borr = abiertos.filter(p => p.A && !p.publicado);
  const tq = ps.filter(p => p.modalidad === 'Trueque');
  let h = `<div class="kpis">
    <div class="kpi"><b>${ps.length}</b><small>pedidos del día</small></div>
    <div class="kpi"><b style="color:${sinAsig.length ? 'var(--rojo)' : 'inherit'}">${sinAsig.length}</b><small>sin asignar</small></div>
    <div class="kpi"><b style="color:${borr.length ? '#B06000' : 'inherit'}">${borr.length}</b><small>en borrador</small></div>
    <div class="kpi"><b>${tq.length}</b><small>trueques</small></div></div>
    <div class="acciones-ruteo"><button class="btn-neg" id="btnGenerar">🧭 Generar ruteo</button><button class="btn-pri" id="btnPublicar" ${borr.length ? '' : 'disabled'}>📤 Publicar${borr.length ? ' (' + borr.length + ')' : ''}</button></div>
    <div class="nota">"Generar ruteo" asigna los pedidos pendientes que no fueron asignados a mano y deja el plan en borrador. Los mensajeros solo ven lo publicado.</div>`;
  h += bloqueAlertas(D.alertas);
  h += `<div class="sec-tit">Mensajeros<span class="lin"></span>${S.selMens ? '<a style="cursor:pointer;color:var(--azul);text-transform:none" data-selmens="">ver todos</a>' : ''}</div>`;
  const rutas = D.rutas || {};
  const maxC = Math.max(60, ...Object.keys(rutas).map(n => rutas[n].carga || 0));
  const lista = D.mensajeros.slice().sort((a, b) => (rutas[b.nombre] ? rutas[b.nombre].carga : 0) - (rutas[a.nombre] ? rutas[a.nombre].carga : 0));
  if (!lista.length) h += '<div class="vacio">No hay mensajeros activos en la hoja Mensajeros para esta ciudad.</div>';
  // promedio de carga por ciudad: la barra se pone roja si supera en 25 % el promedio de su ciudad
  const promC = {};
  lista.forEach(m => { const c = promC[m.ciudad] = promC[m.ciudad] || {s: 0, n: 0}; c.s += rutas[m.nombre] ? rutas[m.nombre].carga : 0; c.n++; });
  lista.forEach(m => {
    const r = rutas[m.nombre] || {carga: 0, paradas: [], fin: '', hora0: ''};
    const mios = ps.filter(p => p.A === m.nombre || p.B === m.nombre);
    const act = mios.filter(abiertoP).length;
    const abierto = S.abiertos[m.nombre];
    h += `<div class="mens ${S.selMens === m.nombre ? 'sel' : ''}">
      <div class="mens-cab" data-mens="${esc(m.nombre)}"><span class="dot" style="background:${colorDe(m.nombre)}"></span>
        <div class="nom"><b>${esc(m.nombre)}</b><small>${esc(m.ciudad || '')} · ${act} activos de ${mios.length}${m.enTurno ? ' · <span style="color:var(--verde)">● en turno</span>' : ''}${m.horaUbic ? ' · GPS ' + esc(m.horaUbic.slice(11)) : ''}</small>
          <div class="barra"><i class="${promC[m.ciudad].n > 1 && r.carga > 1.25 * promC[m.ciudad].s / promC[m.ciudad].n ? 'alta' : ''}" style="width:${Math.round(100 * r.carga / maxC)}%"></i></div></div>
        <div class="carga"><b>${r.carga ? Math.floor(r.carga / 60) + ' h ' + String(r.carga % 60).padStart(2, '0') : '—'}</b>${r.paradas.length ? 'termina ' + esc(r.fin) : 'sin paradas'}</div></div>
      ${abierto ? `<div class="paradas">${r.paradas.length ? r.paradas.map(pa => paradaHtml(pa, m.nombre)).join('') : '<div class="vacio" style="padding:8px">Sin paradas pendientes</div>'}</div>` : ''}
    </div>`;
  });
  if (sinAsig.length){
    h += `<div class="sec-tit">Sin asignar (${sinAsig.length})<span class="lin"></span></div>`;
    h += sinAsig.map(filaPedido).join('');
  }
  return h;
}
const TIPO_TXT = {R: 'Recoger', T: 'Entregar a compañero', B: 'Recibir de compañero', E: 'Entregar'};
function paradaHtml(pa, mens){
  const items = pa.items.map(it => {
    const p = S.D.pedidos.find(x => x.id === it.id); if (!p) return '';
    const lugar = it.tipo === 'R' ? p.tienda : (it.tipo === 'T' || it.tipo === 'B') ? p.punto : p.cliente + (p.direccion ? ' · ' + p.direccion : '');
    const extra = it.tipo === 'T' ? ' → ' + p.B : it.tipo === 'B' ? ' ← ' + p.A : '';
    return `<div data-ped="${esc(p.id)}"><span class="ic ${it.tipo}">${{R: '↑', T: '⇄', B: '⇄', E: '↓'}[it.tipo]}</span><b>#${esc(p.pedido || p.id)}</b> ${TIPO_TXT[it.tipo]}${esc(extra)} · ${esc(lugar)}
      ${p.riesgo && it.tipo === 'E' ? ' <span class="etq riesgo">tarde</span>' : ''}${!p.publicado && abiertoP(p) ? ' <span class="etq borr">borrador</span>' : ''}</div>`;
  }).join('');
  return `<div class="parada"><span class="n" style="background:${colorDe(mens)};color:#fff">${pa.n}</span><span class="h">${esc(pa.eta)}</span><div class="t">${items}</div></div>`;
}
function bloqueAlertas(al){
  if (!al || !al.length) return '';
  const TIT = {truequeRiesgo: 'Trueques atrasados', vencido: 'Vencidos', tarde: 'Entrega estimada tarde', sinUbic: 'Sin ubicar en el mapa', intermunicipal: 'Intermunicipales (asignar a mano)',
    sinAsignar: 'Sin asignar', sinMensajero: 'Sin mensajero en la ciudad', fueraZona: 'Fuera de las zonas dibujadas', borrador: 'Asignados sin publicar', mensajero: 'Mensajero inválido', punto: 'Trueque sin punto válido'};
  const grupos = {}; al.forEach(a => { (grupos[a.tipo] = grupos[a.tipo] || []).push(a); });
  const orden = ['truequeRiesgo', 'vencido', 'tarde', 'sinUbic', 'intermunicipal', 'sinAsignar', 'sinMensajero', 'mensajero', 'punto', 'borrador', 'fueraZona'];
  const rojas = ['truequeRiesgo', 'vencido'];
  return Object.keys(grupos).sort((a, b) => orden.indexOf(a) - orden.indexOf(b)).map(k => {
    const lista = grupos[k], vistos = {};
    const items = lista.filter(a => { const x = vistos[a.id + a.txt]; vistos[a.id + a.txt] = 1; return !x; }).map(a => {
      const p = S.D.pedidos.find(x => x.id === a.id);
      return `<li><a data-ped="${esc(a.id)}">#${esc(p ? (p.pedido || p.id) : a.id)}</a> ${esc(a.txt)}${k === 'truequeRiesgo' && esOp() ? ` · <a data-directo="${esc(a.id)}">Pasar a directo</a>` : ''}</li>`;
    }).join('');
    return `<div class="avisos ${rojas.includes(k) ? 'alerta-roja' : ''}"><details ${rojas.includes(k) ? 'open' : ''}><summary>${TIT[k] || k} (${lista.length})</summary><ul>${items}</ul></details></div>`;
  }).join('');
}
function filaPedido(p){
  const tq = p.modalidad === 'Trueque';
  return `<div class="ped" data-ped="${esc(p.id)}"><span class="sem" style="background:${semaforoP(p)}"></span>
    <div class="c"><b>#${esc(p.pedido || p.id)}</b> ${etqEstado(p)} ${tq ? '<span class="etq tq">TRUEQUE</span>' : ''}${p.modalidad === 'Intermunicipal' ? ' <span class="etq">INTERMUNICIPAL</span>' : ''}${!p.publicado && p.A && abiertoP(p) ? ' <span class="etq borr">borrador</span>' : ''}${p.asignacion === 'Manual' ? ' <span class="etq man">manual</span>' : ''}
      <small>${esc(p.cliente)} · ${esc(p.direccion)}</small><small>${esc(p.tienda)} · ${quienTxt(p)}</small></div>
    <div class="d">${p.hasta ? 'hasta ' + esc(p.hasta) : ''}<br>${abiertoP(p) ? (p.etaEcalc || p.etaE ? 'ETA ' + esc(p.etaEcalc || p.etaE) : '') : esc(p.hCierre || '')}</div></div>`;
}

/* ───────────── Panel SEGUIMIENTO ───────────── */
function panelSeguimiento(){
  const D = S.D, f = S.filtro;
  const ps = D.pedidos.filter(p => {
    if (f.estado === 'activos' && !abiertoP(p)) return false;
    if (f.estado === 'entregados' && p.estado !== 'Entregado') return false;
    if (f.estado === 'novedades' && !['Novedad', 'Cancelado'].includes(p.estado)) return false;
    if (f.estado === 'trueques' && p.modalidad !== 'Trueque') return false;
    if (f.mens && p.A !== f.mens && p.B !== f.mens) return false;
    if (S.selMens && p.A !== S.selMens && p.B !== S.selMens) return false;
    if (f.q){ const q = f.q.toLowerCase(); if (![p.pedido, p.id, p.cliente, p.direccion, p.tienda].some(x => String(x || '').toLowerCase().includes(q))) return false; }
    return true;
  }).sort((a, b) => (abiertoP(b) - abiertoP(a)) || String(a.hasta || '99').localeCompare(String(b.hasta || '99')));
  const cnt = (fn) => D.pedidos.filter(fn).length;
  let h = `<div class="kpis">
    <div class="kpi"><b>${D.pedidos.length}</b><small>pedidos</small></div>
    <div class="kpi"><b>${cnt(abiertoP)}</b><small>en curso o pendientes</small></div>
    <div class="kpi"><b style="color:var(--verde)">${cnt(p => p.estado === 'Entregado')}</b><small>entregados</small></div>
    <div class="kpi"><b style="color:var(--rojo)">${cnt(p => p.estado === 'Novedad')}</b><small>novedades</small></div></div>`;
  h += bloqueAlertas((D.alertas || []).filter(a => ['truequeRiesgo', 'vencido', 'tarde'].includes(a.tipo)));
  h += `<div class="filtros">${[['activos', 'Activos'], ['todos', 'Todos'], ['entregados', 'Entregados'], ['novedades', 'Novedades'], ['trueques', 'Trueques']].map(([k, t]) => `<button class="chip ${f.estado === k ? 'act' : ''}" data-fest="${k}">${t}</button>`).join('')}</div>
    <div class="buscar"><input id="inBuscar" placeholder="Buscar pedido, cliente, dirección o tienda" value="${esc(f.q)}">
      <select id="selMens"><option value="">Todos los mensajeros</option>${D.mensajeros.map(m => `<option ${f.mens === m.nombre ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('')}</select></div>`;
  h += ps.length ? ps.map(filaPedido).join('') : '<div class="vacio">Sin pedidos con estos filtros.</div>';
  return h;
}

/* ───────────── Panel ZONAS Y PUNTOS (operación) ───────────── */
function panelZonas(){
  const D = S.D, e = S.edicion;
  if (S.ciudad === 'Todas') return `<div class="vacio">Elige <b>Bogotá</b> o <b>Medellín</b> arriba para dibujar o editar sus zonas y puntos de encuentro.</div>` + resumenZonas();
  let h = '';
  if (e && (e.tipo === 'zona')){
    h += `<div class="form"><b>${e.nombreAnterior ? 'Editar zona' : 'Nueva zona'} · ${esc(S.ciudad)}</b>
      <p class="nota" style="margin:6px 0 10px">${e.vertices.length < 3 ? 'Haz clic en el mapa para marcar las esquinas de la zona (mínimo 3).' : 'Arrastra los puntos blancos para ajustar. Clic en el mapa agrega una esquina; clic derecho sobre una esquina la quita.'} Esquinas: <b>${e.vertices.length}</b></p>
      <label>Nombre de la zona</label><input id="zNombre" value="${esc(e.nombre || '')}" placeholder="Ej: Norte">
      <div class="fila"><div><label>Mensajero</label><select id="zMens"><option value="">— Sin mensajero —</option>${D.mensajeros.filter(m => !m.ciudad || m.ciudad === S.ciudad).map(m => `<option ${e.mensajero === m.nombre ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('')}</select></div>
      <div style="flex:0 0 80px"><label>Color</label><input type="color" id="zColor" value="${esc(e.color || COLORES[D.zonas.length % COLORES.length])}" style="padding:2px;height:40px"></div></div>
      <div class="acciones-ruteo"><button class="btn-sec" id="zCancelar">Cancelar</button><button class="btn-pri" id="zGuardar" ${e.vertices.length < 3 ? 'disabled' : ''}>Guardar zona</button></div></div>`;
  } else if (e && e.tipo === 'punto'){
    const zs = D.zonas.filter(z => z.ciudad === S.ciudad);
    h += `<div class="form"><b>${e.nombreAnterior ? 'Editar punto de encuentro' : 'Nuevo punto de encuentro'} · ${esc(S.ciudad)}</b>
      <p class="nota" style="margin:6px 0 10px">${e.lat ? 'Arrastra el marcador azul para ajustar la ubicación.' : 'Haz clic en el mapa donde queda el punto.'}</p>
      <label>Nombre</label><input id="pNombre" value="${esc(e.nombre || '')}" placeholder="Ej: Punto Calle 100">
      <label>Dirección o referencia</label><input id="pDir" value="${esc(e.dir || '')}" placeholder="Ej: Calle 100 con Autopista, costado norte">
      <label>Zonas que atiende (ninguna marcada = todas las de la ciudad)</label>
      <div class="zonas-chk">${zs.map(z => `<label><input type="checkbox" value="${esc(z.nombre)}" ${(e.zonas || []).includes(z.nombre) ? 'checked' : ''}> ${esc(z.nombre)}</label>`).join('') || '<i>Aún no hay zonas</i>'}</div>
      <label>Notas para los mensajeros</label><input id="pNotas" value="${esc(e.notas || '')}" placeholder="Ej: frente a la estación">
      <div class="acciones-ruteo"><button class="btn-sec" id="pCancelar">Cancelar</button><button class="btn-pri" id="pGuardar" ${e.lat ? '' : 'disabled'}>Guardar punto</button></div></div>`;
  } else {
    h += `<div class="acciones-ruteo"><button class="btn-neg" id="btnNuevaZona">＋ Nueva zona</button><button class="btn-sec" id="btnNuevoPunto">＋ Punto de encuentro</button></div>`;
  }
  const zs = D.zonas.filter(z => z.ciudad === S.ciudad);
  h += `<div class="sec-tit">Zonas de ${esc(S.ciudad)} (${zs.length})<span class="lin"></span></div>`;
  h += zs.length ? zs.map(z => {
    const n = D.pedidos.filter(p => abiertoP(p) && (String(p.zonaO).replace(' (fuera)', '') === z.nombre || String(p.zonaD).replace(' (fuera)', '') === z.nombre)).length;
    return `<div class="zona"><span class="dot" style="background:${esc(z.color)}"></span><div class="nom"><b>${esc(z.nombre)}</b><small>${z.mensajero ? esc(z.mensajero) : '<span style="color:var(--rojo)">sin mensajero</span>'} · ${n} pedidos activos tocan la zona</small></div>
      <button data-ezona="${esc(z.nombre)}">Editar</button><button class="rojo" data-bzona="${esc(z.nombre)}">Borrar</button></div>`;
  }).join('') : '<div class="nota">Aún no hay zonas. Dibuja una por mensajero.</div>';
  const pts = D.puntos.filter(p => p.ciudad === S.ciudad);
  h += `<div class="sec-tit">Puntos de encuentro (${pts.length})<span class="lin"></span></div>`;
  h += pts.length ? pts.map(p => `<div class="zona"><span class="mk-p" style="width:14px;height:14px;flex:none"></span><div class="nom"><b>${esc(p.nombre)}</b><small>${esc(p.dir || '')} · ${p.zonas.length ? esc(p.zonas.join(', ')) : 'todas las zonas'}</small></div>
      <button data-epunto="${esc(p.nombre)}">Editar</button><button class="rojo" data-bpunto="${esc(p.nombre)}">Borrar</button></div>`).join('')
    : '<div class="nota">Sin puntos. Sin puntos de encuentro no hay trueques: crea 1 o 2 por cada par de zonas vecinas.</div>';
  return h;
}
function resumenZonas(){
  const D = S.D; if (!D.zonas.length) return '';
  return `<table class="t"><tr><th>Zona</th><th>Ciudad</th><th>Mensajero</th></tr>${D.zonas.map(z => `<tr><td><span class="dot" style="display:inline-block;width:10px;height:10px;background:${esc(z.color)}"></span> ${esc(z.nombre)}</td><td>${esc(z.ciudad)}</td><td>${esc(z.mensajero || '—')}</td></tr>`).join('')}</table>`;
}

/* ───────────── Panel INDICADORES ───────────── */
function panelIndicadores(){
  const ps = S.D.pedidos;
  const ent = ps.filter(p => p.estado === 'Entregado'), nov = ps.filter(p => p.estado === 'Novedad');
  const conV = ent.filter(p => p.hasta && p.hCierre), aT = conV.filter(p => aMin(p.hCierre) <= aMin(p.hasta));
  const tq = ps.filter(p => p.modalidad === 'Trueque'), tqC = tq.filter(p => ['Entregado', 'Novedad'].includes(p.estado));
  const evid = ent.filter(p => p.nFotos.R >= 1 && p.nFotos.E >= 1 && (p.modalidad !== 'Trueque' || p.nFotos.T >= 1));
  const pct = (a, b) => b ? Math.round(1000 * a / b) / 10 + ' %' : '—';
  const colorPct = (a, b) => !b ? 'inherit' : a / b >= .95 ? 'var(--verde)' : a / b >= .85 ? '#B06000' : 'var(--rojo)';
  let h = `<div class="kpis">
    <div class="kpi"><b>${ps.length}</b><small>pedidos</small></div>
    <div class="kpi"><b>${ent.length}</b><small>entregados</small></div>
    <div class="kpi"><b style="color:${colorPct(ent.length, ent.length + nov.length)}">${pct(ent.length, ent.length + nov.length)}</b><small>efectividad</small></div>
    <div class="kpi"><b style="color:${colorPct(aT.length, conV.length)}">${pct(aT.length, conV.length)}</b><small>a tiempo (${conV.length} con hora límite)</small></div>
    <div class="kpi"><b>${nov.length}</b><small>novedades</small></div>
    <div class="kpi"><b>${tq.length}</b><small>trueques · ${pct(tqC.filter(p => p.estado === 'Entregado').length, tqC.length)} efectivos</small></div>
    <div class="kpi"><b style="color:${colorPct(evid.length, ent.length)}">${pct(evid.length, ent.length)}</b><small>evidencia completa</small></div>
    <div class="kpi"><b>${ps.filter(abiertoP).length}</b><small>activos</small></div></div>
    <p class="nota">Indicadores del día seleccionado. El histórico por periodos está en la hoja Indicadores de Google Sheets.</p>`;
  const tabla = (titulo, clave) => {
    const g = {};
    ps.forEach(p => { const k = clave(p) || '—'; const x = g[k] = g[k] || {t: 0, e: 0, n: 0, a: 0, at: 0, cv: 0}; x.t++; if (p.estado === 'Entregado'){ x.e++; if (p.hasta && p.hCierre){ x.cv++; if (aMin(p.hCierre) <= aMin(p.hasta)) x.at++; } } else if (p.estado === 'Novedad') x.n++; else if (abiertoP(p)) x.a++; });
    return `<div class="sec-tit">${titulo}<span class="lin"></span></div><table class="t"><tr><th></th><th class="n">Total</th><th class="n">Entreg.</th><th class="n">Novedad</th><th class="n">Activos</th><th class="n">A tiempo</th></tr>` +
      Object.keys(g).sort((a, b) => g[b].t - g[a].t).map(k => `<tr><td>${esc(k)}</td><td class="n">${g[k].t}</td><td class="n">${g[k].e}</td><td class="n">${g[k].n}</td><td class="n">${g[k].a}</td><td class="n" style="color:${colorPct(g[k].at, g[k].cv)};font-weight:700">${pct(g[k].at, g[k].cv)}</td></tr>`).join('') + '</table>';
  };
  h += tabla('Por mensajero (quien entrega)', p => p.modalidad === 'Trueque' ? p.B : p.A);
  h += tabla('Por tienda', p => p.tienda);
  h += tabla('Por modalidad', p => p.modalidad || 'Sin asignar');
  const mot = {}; nov.forEach(p => { mot[p.motivoNovedad || 'Sin motivo'] = (mot[p.motivoNovedad || 'Sin motivo'] || 0) + 1; });
  if (nov.length) h += `<div class="sec-tit">Novedades por motivo<span class="lin"></span></div><table class="t"><tr><th>Motivo</th><th class="n">Cantidad</th></tr>${Object.keys(mot).sort((a, b) => mot[b] - mot[a]).map(k => `<tr><td>${esc(k)}</td><td class="n">${mot[k]}</td></tr>`).join('')}</table>`;
  return h;
}

/* ───────────── Eventos del panel ───────────── */
$('#panel').addEventListener('click', async e => {
  const t = e.target;
  const dir = t.closest('[data-directo]'); if (dir){ e.stopPropagation(); pasarDirecto(dir.dataset.directo); return; }
  const ped = t.closest('[data-ped]'); if (ped){ abrirDetalle(ped.dataset.ped); return; }
  const mc = t.closest('[data-mens]');
  if (mc){ const n = mc.dataset.mens; S.abiertos[n] = !S.abiertos[n]; S.selMens = S.abiertos[n] ? n : (S.selMens === n ? null : S.selMens); pintarPanel(); pintarMapa(S.abiertos[n]); return; }
  const sm = t.closest('[data-selmens]'); if (sm){ S.selMens = null; S.abiertos = {}; pintarPanel(); pintarMapa(true); return; }
  const fe = t.closest('[data-fest]'); if (fe){ S.filtro.estado = fe.dataset.fest; pintarPanel(); pintarMapa(); return; }
  if (t.id === 'btnGenerar') return generar();
  if (t.id === 'btnPublicar') return publicar();
  if (t.id === 'btnNuevaZona'){ S.edicion = {tipo: 'zona', vertices: []}; pintarPanel(); pintarMapa(); avisoMapa('Clic en el mapa para marcar las esquinas de la zona'); return; }
  if (t.id === 'btnNuevoPunto'){ S.edicion = {tipo: 'punto'}; pintarPanel(); pintarMapa(); avisoMapa('Clic en el mapa donde queda el punto de encuentro'); return; }
  const ez = t.closest('[data-ezona]');
  if (ez){ const z = S.D.zonas.find(x => x.nombre === ez.dataset.ezona && x.ciudad === S.ciudad); S.edicion = {tipo: 'zona', nombreAnterior: z.nombre, nombre: z.nombre, mensajero: z.mensajero, color: z.color, vertices: z.poligono.map(p => p.slice())}; pintarPanel(); pintarMapa(true); return; }
  const bz = t.closest('[data-bzona]');
  if (bz && confirm('¿Borrar la zona ' + bz.dataset.bzona + '? Los pedidos de esa zona quedarán "fuera de zona" hasta que la redibujes.')){ await guardar('admBorrarZona', {nombre: bz.dataset.bzona, ciudad: S.ciudad}, 'Zona borrada'); return; }
  const ep = t.closest('[data-epunto]');
  if (ep){ const p = S.D.puntos.find(x => x.nombre === ep.dataset.epunto && x.ciudad === S.ciudad); S.edicion = Object.assign({tipo: 'punto', nombreAnterior: p.nombre}, JSON.parse(JSON.stringify(p))); pintarPanel(); pintarMapa(); S.mapa && S.mapa.setView([p.lat, p.lng], 15); return; }
  const bp = t.closest('[data-bpunto]');
  if (bp && confirm('¿Borrar el punto de encuentro ' + bp.dataset.bpunto + '? Los trueques ya publicados que lo usan seguirán con ese nombre.')){ await guardar('admBorrarPunto', {nombre: bp.dataset.bpunto, ciudad: S.ciudad}, 'Punto borrado'); return; }
  if (t.id === 'zCancelar' || t.id === 'pCancelar'){ cancelarEdicion(); pintarPanel(); pintarMapa(); return; }
  if (t.id === 'zGuardar'){
    const e2 = S.edicion, nombre = $('#zNombre').value.trim();
    if (!nombre) return toast('Escribe el nombre de la zona');
    await guardar('admGuardarZona', {zona: {nombre, nombreAnterior: e2.nombreAnterior || '', ciudad: S.ciudad, mensajero: $('#zMens').value, color: $('#zColor').value, poligono: e2.vertices}}, 'Zona guardada');
    return;
  }
  if (t.id === 'pGuardar'){
    const e2 = S.edicion, nombre = $('#pNombre').value.trim();
    if (!nombre) return toast('Escribe el nombre del punto');
    const zonas = $$('.zonas-chk input:checked').map(x => x.value);
    await guardar('admGuardarPunto', {punto: {nombre, nombreAnterior: e2.nombreAnterior || '', ciudad: S.ciudad, dir: $('#pDir').value.trim(), notas: $('#pNotas').value.trim(), lat: e2.lat, lng: e2.lng, zonas}}, 'Punto guardado');
    return;
  }
});

async function guardar(accion, datos, ok){
  try { await api(accion, datos); toast('✓ ' + ok); cancelarEdicion(); await cargar(); }
  catch(e){ toast(e.message); }
}
function cancelarEdicion(){ S.edicion = null; $('#avisoMapa').classList.add('oculto'); }

async function generar(){
  const ab = S.D.pedidos.filter(p => p.estado === 'Pendiente' && p.asignacion !== 'Manual').length;
  if (!confirm('Generar ruteo de ' + fechaLarga(S.fecha) + ' (' + (S.ciudad === 'Todas' ? 'ambas ciudades' : S.ciudad) + ').\n\nSe reasignan ' + ab + ' pedidos pendientes no manuales. Los que ya cambian quedan en borrador hasta publicar.\n¿Continuar?')) return;
  const b = $('#btnGenerar'); b.disabled = true; b.innerHTML = '<span class="spin" style="border-top-color:#FFD200"></span> Calculando…';
  try {
    const r = await api('admGenerar', {fecha: S.fecha, ciudad: S.ciudad});
    const s = r.resumen;
    toast('Ruteo listo: ' + s.directos + ' directos · ' + s.trueques + ' trueques' + (s.sinAsignar ? ' · ' + s.sinAsignar + ' sin asignar' : '') + ' · ' + s.cambios + ' cambios');
    await cargar(true);
  } catch(e){ toast(e.message); b.disabled = false; b.textContent = '🧭 Generar ruteo'; }
}
async function publicar(){
  if (!confirm('Publicar el plan: los mensajeros verán sus pedidos en la app en el siguiente minuto. ¿Continuar?')) return;
  try { const r = await api('admPublicar', {fecha: S.fecha, ciudad: S.ciudad}); toast('📤 ' + r.publicados + ' pedidos publicados'); await cargar(); }
  catch(e){ toast(e.message); }
}
async function pasarDirecto(id){
  const p = S.D.pedidos.find(x => x.id === id);
  if (!confirm('Cancelar el trueque del pedido #' + (p.pedido || id) + ': lo entrega directamente ' + p.A + '. ¿Continuar?')) return;
  try { await api('admPasarDirecto', {id}); toast('✓ Pasó a entrega directa por ' + p.A); await cargar(); if (!$('#det').classList.contains('oculto')) abrirDetalle(id); }
  catch(e){ toast(e.message); }
}

/* ───────────── Detalle de pedido ───────────── */
async function abrirDetalle(id){
  const p = S.D.pedidos.find(x => x.id === id); if (!p) return;
  const tq = p.modalidad === 'Trueque', op = esOp();
  const paso = (ok, cls, tit, sub) => `<div class="paso ${ok ? cls || 'ok' : ''}"><b>${tit}</b>${sub ? '<small>' + sub + '</small>' : ''}</div>`;
  let lin = paso(true, 'ok', 'Creado', esc(p.fecha)) +
    paso(!!p.hAceptado, 'ok', 'Aceptado' + (p.hAceptado ? ' · ' + esc(p.hAceptado) : ''), p.A ? esc(p.A) : '') +
    paso(!!p.hRecogido, 'ok', 'Recogido en tienda' + (p.hRecogido ? ' · ' + esc(p.hRecogido) : ''), esc(p.tienda) + (p.entregaTienda ? ' · entregó ' + esc(p.entregaTienda) : '') + (p.etaR && !p.hRecogido ? ' · estimado ' + esc(p.etaR) : ''));
  if (tq) lin += paso(!!p.hTransferido, 'tq', 'Traspaso ' + esc(p.A) + ' → ' + esc(p.B) + (p.hTransferido ? ' · ' + esc(p.hTransferido) : ''), esc(p.punto) + (p.horaTrueque ? ' · pactado ' + esc(p.horaTrueque) : '')) +
                 paso(!!p.hRecibido, 'tq', 'Recibido por ' + esc(p.B) + (p.hRecibido ? ' · ' + esc(p.hRecibido) : ''), '');
  lin += p.estado === 'Novedad' ? paso(true, 'nov', 'Novedad · ' + esc(p.hCierre), esc(p.motivoNovedad) + (p.observacion ? ' · ' + esc(p.observacion) : ''))
       : p.estado === 'Cancelado' ? paso(true, 'nov', 'Cancelado', esc(p.observacion))
       : paso(p.estado === 'Entregado', 'ok', 'Entregado' + (p.hCierre ? ' · ' + esc(p.hCierre) : ''), p.recibe ? 'Recibió ' + esc(p.recibe) : (p.etaEcalc || p.etaE ? 'estimado ' + esc(p.etaEcalc || p.etaE) : ''));
  const mensOpts = (sel, vacia) => `<option value="">${vacia}</option>` + S.D.mensajeros.filter(m => !m.ciudad || m.ciudad === p.ciudad).map(m => `<option ${sel === m.nombre ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('');
  const ptsOpts = S.D.puntos.filter(x => x.ciudad === p.ciudad).map(x => `<option ${p.punto === x.nombre ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('');
  const editable = op && abiertoP(p);
  $('#detHoja').innerHTML = `<button class="cerrar" id="detCerrar" aria-label="Cerrar">×</button>
    <h2>Pedido #${esc(p.pedido || p.id)}</h2>
    <div class="sub">${etqEstado(p)} ${tq ? '<span class="etq tq">TRUEQUE</span>' : ''} ${p.riesgo ? '<span class="etq riesgo">entrega estimada tarde</span>' : ''} · ${esc(p.id)} · ${esc(p.ciudad)}</div>
    <dl class="datos">
      <dt>Tienda</dt><dd>${esc(p.tienda)}${p.dirTienda ? '<br><small>' + esc(p.dirTienda) + '</small>' : ''}</dd>
      <dt>Cliente</dt><dd>${esc(p.cliente)}${p.telefono ? ' · ' + esc(p.telefono) : ''}<br><small>${esc(p.direccion)}${p.ciudadDestino && p.ciudadDestino !== p.ciudad ? ' · ' + esc(p.ciudadDestino) : ''}</small></dd>
      <dt>Contenido</dt><dd>${p.paquetes ? esc(p.paquetes) + ' paquete(s)' : '—'}${p.descripcion ? ' · ' + esc(p.descripcion) : ''}</dd>
      <dt>Ventana</dt><dd>${esc(p.desde || '—')} a ${esc(p.hasta || '—')} · prioridad ${esc(p.prioridad)}</dd>
      ${p.indicaciones ? `<dt>Indicaciones</dt><dd>${esc(p.indicaciones)}</dd>` : ''}
      <dt>Asignación</dt><dd>${quienTxt(p)}${tq ? '<br><small>en ' + esc(p.punto) + (p.horaTrueque ? ' a las ' + esc(p.horaTrueque) : '') + '</small>' : ''}${!p.publicado && p.A && abiertoP(p) ? ' <span class="etq borr">borrador</span>' : ''}</dd>
      <dt>Zonas</dt><dd>${esc(p.zonaO || '—')} → ${esc(p.zonaD || '—')}</dd>
    </dl>
    ${op && p.motivoAsig ? `<div class="motivo">🧭 ${esc(p.motivoAsig)}</div>` : ''}
    <div class="sec-tit">Línea de tiempo<span class="lin"></span></div><div class="linea">${lin}</div>
    <div class="sec-tit">Evidencias<span class="lin"></span></div><div class="galeria" id="galeria">${p.conFotos ? '<div class="f"><span class="spin"></span></div>' : '<div class="nota" style="grid-column:1/-1">Sin fotos todavía.</div>'}</div>
    ${editable ? `<div class="sec-tit">Ajustar asignación<span class="lin"></span></div>

        <div class="fila"><div><label>Recoge en tienda</label><select id="dA" ${['Recogido', 'Transferido', 'Recibido'].includes(p.estado) ? 'disabled' : ''}>${mensOpts(p.A, '— sin asignar —')}</select></div>
        <div><label>Entrega (si es trueque)</label><select id="dB" ${['Transferido', 'Recibido'].includes(p.estado) ? 'disabled' : ''}>${mensOpts(tq ? p.B : '', '— el mismo (directo) —')}</select></div></div>
        <div class="fila"><div><label>Punto de encuentro</label><select id="dP"><option value="">—</option>${ptsOpts}</select></div>
        <div style="flex:0 0 120px"><label>Hora trueque</label><input id="dH" type="time" value="${esc(p.horaTrueque || '')}"></div></div>
        <div class="acciones-ruteo"><button class="btn-pri" id="dGuardar">Guardar asignación</button></div>
        <p class="nota" style="margin:0">Queda como asignación manual: "Generar ruteo" ya no la cambia. Hora vacía = la calcula el sistema.</p>
      </div>
      <div class="acciones-ruteo">${tq && !['Transferido', 'Recibido'].includes(p.estado) ? `<button class="btn-sec" data-directo="${esc(p.id)}">Pasar a directo</button>` : ''}<button class="btn-rojo" id="dCancelar">Cancelar pedido</button></div>` : ''}`;
  $('#det').classList.remove('oculto');
  $('#detCerrar').onclick = () => $('#det').classList.add('oculto');
  const dg = $('#dGuardar');
  if (dg) dg.onclick = async () => {
    const A = $('#dA').value, B = $('#dB').value, punto = $('#dP').value, horaTrueque = $('#dH').value;
    if (B && B !== A && !punto) return toast('Elige el punto de encuentro del trueque');
    try { await api('admMover', {id: p.id, A, B, punto, horaTrueque}); toast('✓ Asignación guardada'); await cargar(); abrirDetalle(p.id); } catch(e){ toast(e.message); }
  };
  const dc = $('#dCancelar');
  if (dc) dc.onclick = async () => {
    const motivo = prompt('Motivo de la cancelación del pedido #' + (p.pedido || p.id) + ':'); if (motivo === null) return;
    try { await api('admCancelar', {id: p.id, motivo}); toast('Pedido cancelado'); await cargar(); abrirDetalle(p.id); } catch(e){ toast(e.message); }
  };
  enfocarPedido(p);
  if (p.conFotos) cargarFotos(p);
}
$('#det').addEventListener('click', e => { if (e.target.id === 'det') $('#det').classList.add('oculto'); const d = e.target.closest('[data-directo]'); if (d) pasarDirecto(d.dataset.directo); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#visor').classList.add('oculto'); $('#det').classList.add('oculto'); } });
const cacheFotos = {};
async function cargarFotos(p){
  const g = $('#galeria');
  try {
    const r = await api('admFotos', {id: p.id});
    const lista = [].concat(r.fotos.R.map(n => ['R', n]), (r.fotos.T || []).map(n => ['T', n]), (r.fotos.B || []).map(n => ['B', n]), r.fotos.E.map(n => ['E', n]));
    if (!lista.length){ g.innerHTML = '<div class="nota" style="grid-column:1/-1">Sin fotos.</div>'; return; }
    const ROT = {R: 'Recogida', T: 'Traspaso', B: 'Recibido', E: p.estado === 'Novedad' ? 'Novedad' : 'Entrega'};
    g.innerHTML = lista.map(([e, n]) => `<div class="f" data-foto="${esc(n)}"><span>${ROT[e]}</span></div>`).join('');
    for (const [, n] of lista){
      const el = g.querySelector(`[data-foto="${CSS.escape(n)}"]`);
      try {
        const data = cacheFotos[n] || (cacheFotos[n] = (await api('admFoto', {id: p.id, nombre: n})).data);
        if (el){ el.style.backgroundImage = `url(${data})`; el.onclick = () => { $('#visorImg').src = data; $('#visor').classList.remove('oculto'); }; }
      } catch(e){ if (el) el.insertAdjacentHTML('beforeend', 'No disponible'); }
    }
  } catch(e){ g.innerHTML = `<div class="nota" style="grid-column:1/-1">${esc(e.message)}</div>`; }
}
$('#visor').onclick = () => $('#visor').classList.add('oculto');

/* ───────────── MAPA ───────────── */
function iniciarMapa(){
  if (S.mapa || !window.L){ if (!window.L) $('#mapa').innerHTML = '<div class="vacio" style="padding-top:30vh">El mapa necesita conexión a internet.</div>'; return; }
  S.mapa = L.map('mapa', {zoomControl: true}).setView(CENTROS[S.ciudad] || CENTROS.Todas, 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(S.mapa);
  S.grupos = {};
  ['zonas', 'rutas', 'pedidos', 'tiendas', 'puntos', 'mensajeros', 'edicion', 'foco'].forEach(k => S.grupos[k] = L.layerGroup().addTo(S.mapa));
  S.mapa.on('click', clicMapa);
}
function pintarCapasCtl(){
  const nombres = [['zonas', 'Zonas'], ['rutas', 'Rutas'], ['pedidos', 'Clientes'], ['tiendas', 'Tiendas'], ['puntos', 'Puntos'], ['mensajeros', 'Mensajeros']];
  $('#capas').innerHTML = nombres.map(([k, t]) => `<label><input type="checkbox" data-capa="${k}" ${S.capas[k] ? 'checked' : ''}> ${t}</label>`).join('');
}
$('#capas').addEventListener('change', e => { const k = e.target.dataset.capa; if (!k) return; S.capas[k] = e.target.checked; ls.set('cvadm_capas', S.capas); pintarMapa(); });
const icono = (html, w, h, ax, ay) => L.divIcon({className: '', html, iconSize: [w, h], iconAnchor: [ax == null ? w / 2 : ax, ay == null ? h / 2 : ay]});

function pedidosVisibles(){
  const D = S.D, f = S.filtro;
  return D.pedidos.filter(p => {
    if (S.selMens && p.A !== S.selMens && p.B !== S.selMens) return false;
    if (S.tab === 'seguimiento'){
      if (f.estado === 'activos' && !abiertoP(p)) return false;
      if (f.estado === 'entregados' && p.estado !== 'Entregado') return false;
      if (f.estado === 'novedades' && !['Novedad', 'Cancelado'].includes(p.estado)) return false;
      if (f.estado === 'trueques' && p.modalidad !== 'Trueque') return false;
      if (f.mens && p.A !== f.mens && p.B !== f.mens) return false;
    }
    return true;
  });
}
function pintarMapa(encuadrar){
  if (!S.mapa || !S.D) return;
  const G = S.grupos, D = S.D, lim = [];
  Object.keys(G).forEach(k => { if (k !== 'foco') G[k].clearLayers(); });
  const atenuar = (n) => S.selMens && n !== S.selMens;
  const enZonas = S.tab === 'zonas';
  // Zonas
  if (S.capas.zonas || enZonas) D.zonas.forEach(z => {
    if (S.edicion && S.edicion.tipo === 'zona' && S.edicion.nombreAnterior === z.nombre && z.ciudad === S.ciudad) return;
    const pg = L.polygon(z.poligono, {color: z.color || '#555', weight: 2, opacity: atenuar(z.mensajero) ? .35 : .9, fillOpacity: atenuar(z.mensajero) ? .03 : .09}).addTo(G.zonas);
    pg.bindTooltip(`${esc(z.nombre)}${z.mensajero ? '<br>' + esc(z.mensajero) : ''}`, {permanent: true, direction: 'center', className: 'zona-lbl'});
    pg.on('click', ev => { if (S.edicion) clicMapa(ev); });
    z.poligono.forEach(v => lim.push(v));
  });
  // Tiendas
  if (S.capas.tiendas) D.tiendas.forEach(t => L.marker([t.lat, t.lng], {icon: icono('<div class="mk-t">T</div>', 22, 22), zIndexOffset: 300}).bindTooltip('<b>' + esc(t.nombre) + '</b><br>' + esc(t.dir || '')).addTo(G.tiendas));
  // Puntos de encuentro
  if (S.capas.puntos || enZonas) D.puntos.forEach(p => {
    if (S.edicion && S.edicion.tipo === 'punto' && S.edicion.nombreAnterior === p.nombre) return;
    L.marker([p.lat, p.lng], {icon: icono('<div class="mk-p"></div>', 22, 22), zIndexOffset: 400}).bindTooltip('<b>⇄ ' + esc(p.nombre) + '</b><br>' + esc(p.dir || '') + '<br><small>' + (p.zonas.length ? esc(p.zonas.join(', ')) : 'todas las zonas') + '</small>').addTo(G.puntos);
  });
  if (!enZonas){
    // Rutas
    if (S.capas.rutas) Object.keys(D.rutas || {}).forEach(n => {
      const r = D.rutas[n]; if (!r.paradas.length) return;
      const col = colorDe(n), tenue = atenuar(n);
      const linea = r.paradas.map(pa => [pa.lat, pa.lng]);
      if (r.inicio) linea.unshift([r.inicio.lat, r.inicio.lng]);
      L.polyline(linea, {color: col, weight: tenue ? 2 : 4, opacity: tenue ? .2 : .8}).addTo(G.rutas);
      if (!tenue) r.paradas.forEach(pa => {
        const tipos = pa.items.map(i => i.tipo);
        L.marker([pa.lat, pa.lng], {icon: icono(`<div class="mk-n" style="background:${col}">${pa.n}</div>`, 20, 20), zIndexOffset: 500})
          .bindTooltip(`<b>${esc(n)} · parada ${pa.n} · ${esc(pa.eta)}</b><br>` + pa.items.map(it => { const p = D.pedidos.find(x => x.id === it.id); return TIPO_TXT[it.tipo] + ' #' + esc(p ? p.pedido || p.id : it.id); }).join('<br>'))
          .on('click', () => { const it = pa.items[0]; abrirDetalle(it.id); }).addTo(G.rutas);
        if (S.selMens) lim.push([pa.lat, pa.lng]);
        void tipos;
      });
    });
    // Clientes (destinos)
    if (S.capas.pedidos) pedidosVisibles().forEach(p => {
      if (!p.lat || !p.lng) return;
      L.marker([p.lat, p.lng], {icon: icono(`<div class="mk-c" style="background:${semaforoP(p)}"></div>`, 14, 14), zIndexOffset: 200})
        .bindTooltip(`<b>#${esc(p.pedido || p.id)}</b> · ${esc(p.estado)}<br>${esc(p.cliente)}<br><small>${quienTxt(p)}</small>`).on('click', () => abrirDetalle(p.id)).addTo(G.pedidos);
      if (!S.selMens) lim.push([p.lat, p.lng]);
    });
    // Mensajeros (posición actual)
    if (S.capas.mensajeros) D.mensajeros.forEach(m => {
      if (!m.lat || !m.lng) return;
      L.marker([m.lat, m.lng], {icon: icono(`<div class="mk-m" style="background:${colorDe(m.nombre)};opacity:${atenuar(m.nombre) ? .35 : 1}">${esc(iniciales(m.nombre))}</div>`, 30, 30), zIndexOffset: 900})
        .bindTooltip(`<b>${esc(m.nombre)}</b><br>GPS ${esc(m.horaUbic || '')}${m.enTurno ? '<br>● en turno' : ''}`).addTo(G.mensajeros);
    });
  }
  pintarEdicion();
  if (encuadrar){
    if (lim.length > 1) S.mapa.fitBounds(lim, {padding: [40, 40], maxZoom: 15});
    else S.mapa.setView(CENTROS[S.ciudad] || CENTROS.Todas, 12);
  }
}
function enfocarPedido(p){
  if (!S.mapa) return;
  const G = S.grupos.foco; G.clearLayers();
  const pts = [];
  if (p.latO && p.lngO) pts.push([p.latO, p.lngO]);
  const pt = p.modalidad === 'Trueque' ? S.D.puntos.find(x => x.nombre === p.punto && x.ciudad === p.ciudad) : null;
  if (pt) pts.push([pt.lat, pt.lng]);
  if (p.lat && p.lng) pts.push([p.lat, p.lng]);
  if (pts.length > 1) L.polyline(pts, {color: p.modalidad === 'Trueque' ? '#1A73E8' : '#111', weight: 4, dashArray: '8 8'}).addTo(G);
  if (p.lat && p.lng) L.circleMarker([p.lat, p.lng], {radius: 12, color: '#111', weight: 3, fill: false}).addTo(G);
  if (pts.length) S.mapa.fitBounds(pts.length > 1 ? pts : [pts[0], pts[0]], {padding: [80, 80], maxZoom: 15});
  setTimeout(() => G.clearLayers(), 20000);
}

/* Edición de zonas y puntos sobre el mapa */
function avisoMapa(txt){ const a = $('#avisoMapa'); a.innerHTML = esc(txt); a.classList.remove('oculto'); }
function clicMapa(ev){
  const e = S.edicion; if (!e) return;
  const ll = [+ev.latlng.lat.toFixed(6), +ev.latlng.lng.toFixed(6)];
  if (e.tipo === 'zona'){
    if (e.vertices.length < 3) e.vertices.push(ll);
    else e.vertices.splice(posInsercion(e.vertices, ll), 0, ll);   // agrega la esquina en el lado más cercano
    if (e.vertices.length >= 3) $('#avisoMapa').classList.add('oculto');
  } else { e.lat = ll[0]; e.lng = ll[1]; $('#avisoMapa').classList.add('oculto'); }
  pintarPanel(); pintarEdicion();
}
function posInsercion(v, p){
  let mejor = 0, costo = Infinity;
  const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  for (let i = 0; i < v.length; i++){ const a = v[i], b = v[(i + 1) % v.length]; const c = d(a, p) + d(p, b) - d(a, b); if (c < costo){ costo = c; mejor = i + 1; } }
  return mejor;
}
function pintarEdicion(){
  if (!S.grupos) return;
  const G = S.grupos.edicion; G.clearLayers();
  const e = S.edicion; if (!e) return;
  if (e.tipo === 'zona'){
    const col = e.color || '#111';
    if (e.vertices.length >= 3) L.polygon(e.vertices, {color: col, weight: 3, dashArray: '6 6', fillOpacity: .15}).addTo(G);
    else if (e.vertices.length === 2) L.polyline(e.vertices, {color: col, weight: 3, dashArray: '6 6'}).addTo(G);
    e.vertices.forEach((v, i) => {
      const m = L.marker(v, {draggable: true, icon: icono('<div class="mk-v"></div>', 12, 12), zIndexOffset: 2000}).addTo(G);
      m.on('drag', ev => { const q = ev.target.getLatLng(); e.vertices[i] = [+q.lat.toFixed(6), +q.lng.toFixed(6)]; });
      m.on('dragend', () => pintarEdicion());
      m.on('contextmenu', () => { if (e.vertices.length <= 3) return toast('Una zona necesita al menos 3 esquinas'); e.vertices.splice(i, 1); pintarPanel(); pintarEdicion(); });
    });
  } else if (e.lat){
    const m = L.marker([e.lat, e.lng], {draggable: true, icon: icono('<div class="mk-p" style="width:26px;height:26px"></div>', 26, 26), zIndexOffset: 2000}).addTo(G);
    m.on('dragend', ev => { const q = ev.target.getLatLng(); e.lat = +q.lat.toFixed(6); e.lng = +q.lng.toFixed(6); });
  }
}

/* ───────────── Toast ───────────── */
let tT;
function toast(t){ const el = $('#toast'); el.textContent = t; el.className = 'ver'; clearTimeout(tT); tT = setTimeout(() => el.className = '', 4200); }

/* ───────────── MODO DEMO (datos ficticios; usa el mismo motor de ruteo del servidor) ───────────── */
// Copia del motor de Code.gs (solo para el modo demo)
const ABIERTOS = ['Pendiente', 'Aceptado', 'Recogido', 'Transferido', 'Recibido'];
function normalizar_(s){ return String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
// ==MOTOR-INICIO==  (funciones puras: no usan servicios de Google; se prueban fuera de Apps Script)
/**
 * Parámetros del ruteo. Se pueden ajustar tras las primeras semanas de operación.
 *   VEL_KMH / FACTOR: velocidad urbana promedio en moto y factor calles vs línea recta.
 *   MIN_PARADA: minutos por parada (parquear, entregar, firma, foto).
 *   PEN_PRIORIDAD: minutos "virtuales" que retrasan Media y Baja frente a Alta.
 *   MIN_TRUEQUE: minutos que cuesta cada entrega de un pedido entre mensajeros.
 *   MARGEN_TRUEQUE_MIN: el trueque debe ahorrar al menos esto frente a la mejor opción directa.
 *   BAL_TOL: se balancea si la ruta más larga de la ciudad supera en más de este % a la más corta (0,2 = 20 %).
 *   BAL_MAX_EXTRA_MIN: minutos de trabajo total extra que se aceptan por cada pedido que se mueve para balancear.
 *   El costo de una opción es lo que crece la ruta simulada del mensajero (minutos) + 3 × los minutos de retraso que cause.
 *   REGRESO_BASE: para comparar opciones se cuenta el regreso del mensajero a su zona al final (no cambia las horas que se muestran).
 */
const RUTA = { VEL_KMH: 18, FACTOR: 1.35, MIN_PARADA: 6, PEN_PRIORIDAD: { Alta: 0, Media: 15, Baja: 30 }, MISMO_PUNTO_KM: 0.12,
  MIN_TRUEQUE: 5, MARGEN_TRUEQUE_MIN: 8, BAL_TOL: 0.2, BAL_MAX_EXTRA_MIN: 25, ITER_TRUEQUE: 3, REGRESO_BASE: true,
  CENTRO: { 'bogota': { lat: 4.6533, lng: -74.0836 }, 'medellin': { lat: 6.2442, lng: -75.5812 } } };

function kmEntre_(a, b) {
  const R = 6371, r = Math.PI / 180;
  const x = Math.pow(Math.sin((b.lat - a.lat) * r / 2), 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.pow(Math.sin((b.lng - a.lng) * r / 2), 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function minViaje_(a, b) { return a && b ? kmEntre_(a, b) * RUTA.FACTOR / RUTA.VEL_KMH * 60 : 0; }

/** Punto dentro de polígono (polígono = [[lat, lng], …]). */
function puntoEnPoligono_(lat, lng, poli) {
  let dentro = false;
  for (let i = 0, j = poli.length - 1; i < poli.length; j = i++) {
    const yi = poli[i][0], xi = poli[i][1], yj = poli[j][0], xj = poli[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi)) dentro = !dentro;
  }
  return dentro;
}
function centroide_(poli) {
  let la = 0, ln = 0; poli.forEach(p => { la += p[0]; ln += p[1]; });
  return { lat: la / poli.length, lng: ln / poli.length };
}
/** Zona que contiene el punto. Si ninguna lo contiene, la más cercana (fuera = true). */
function zonaDePunto_(zonas, ciudad, lat, lng) {
  const zs = zonas.filter(z => !ciudad || normalizar_(z.ciudad) === normalizar_(ciudad));
  if (!zs.length) return null;
  for (let i = 0; i < zs.length; i++) if (puntoEnPoligono_(lat, lng, zs[i].poligono)) return { nombre: zs[i].nombre, mensajero: zs[i].mensajero, fuera: false };
  let mejor = null, dmin = Infinity;
  zs.forEach(z => {
    // distancia al vértice o al centro más cercano de la zona
    const cands = z.poligono.map(p => ({ lat: p[0], lng: p[1] })).concat([centroide_(z.poligono)]);
    cands.forEach(c => { const d = kmEntre_({ lat, lng }, c); if (d < dmin) { dmin = d; mejor = z; } });
  });
  return { nombre: mejor.nombre, mensajero: mejor.mensajero, fuera: true };
}

function hhmmMin_(m) { if (m === null || m === undefined || !isFinite(m)) return ''; m = Math.round(m); if (m >= 1440) m = 1439; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }
function minDeHora_(h) { const m = String(h || '').match(/^(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }

/**
 * Motor de ruteo.
 * entrada = {
 *   ahoraMin: minuto del día desde el que se planifica,
 *   asignar: true = "Generar ruteo" (reasigna pedidos Pendientes no manuales) · false = solo calcula rutas y horas con lo asignado,
 *   pedidos: [{ id, ciudad, prio, desde, hasta (minutos o null), t:{lat,lng}|null (tienda), d:{lat,lng}|null (cliente),
 *               estado, intermunicipal, A, B (nombres), fijo (asignación manual), punto (nombre), horaTrueque (min o null), tienda, cliente }],
 *   mensajeros: [{ nombre, ciudad, inicio:{lat,lng}|null, hora0 (min) }],
 *   zonas: [{ nombre, ciudad, mensajero, poligono }],
 *   puntos: [{ nombre, ciudad, lat, lng, zonas:[nombres] }]
 * }
 * salida = { pedidos: { id: {A, B, modalidad, punto, horaTrueque, orden, etaR, etaE, motivo, zonaO, zonaD, riesgo} },
 *            rutas: { nombre: {ciudad, inicio, hora0, fin, carga, paradas:[{n, lat, lng, eta, items:[{id, tipo}]}]} }, avisos: [] }
 */
function motorRuteo_(E) {
  const avisos = [];
  const N = (s) => normalizar_(s);
  const ahora = E.ahoraMin || 0;

  // ── Mensajeros y su punto de partida
  const drv = {};
  (E.mensajeros || []).forEach(m => {
    const zonasM = (E.zonas || []).filter(z => N(z.mensajero) === N(m.nombre));
    const base = m.inicio || (zonasM.length ? centroide_(zonasM[0].poligono) : (RUTA.CENTRO[N(m.ciudad)] || null));
    drv[N(m.nombre)] = { nombre: m.nombre, ciudad: m.ciudad || (zonasM[0] && zonasM[0].ciudad) || '', base, hora0: Math.max(ahora, m.hora0 || 0), st: [], c: null };
  });
  const D = (nombre) => nombre ? drv[N(nombre)] || null : null;
  const delaCiudad = (ciudad) => Object.keys(drv).map(k => drv[k]).filter(d => N(d.ciudad) === N(ciudad));
  const drvZona = (z, ciudad, punto) => {
    if (z && z.mensajero && D(z.mensajero) && N(D(z.mensajero).ciudad) === N(ciudad)) return D(z.mensajero);
    // zona sin mensajero: el mensajero de la ciudad cuya base está más cerca
    let mejor = null, dm = Infinity;
    delaCiudad(ciudad).forEach(d => { if (!d.base || !punto) return; const x = kmEntre_(d.base, punto); if (x < dm) { dm = x; mejor = d; } });
    return mejor;
  };

  // ── Costo de la ruta de un mensajero = minutos de recorrido + 3 × minutos de retraso sobre la hora límite
  const costoRuta = (d, extra) => { const r = recorrido_(d, extra ? d.st.concat(extra) : d.st); return { dur: r.fin - d.hora0, costo: (r.fin - d.hora0) + r.regreso + 3 * r.tarde }; };
  const actual = (d) => { if (!d.c) d.c = costoRuta(d); return d.c; };
  const delta = (d, extra) => costoRuta(d, extra).costo - actual(d).costo;
  const poner = (d, extra) => { d.st = d.st.concat(extra); d.c = null; };
  const quitar = (d, id) => { d.st = d.st.filter(x => x.s.id !== id); d.c = null; };
  // Paradas de cada rol (en la planeación las de trueque no tienen hora: se sincronizan al final)
  const stR = (p) => ({ key: p.id + '|R', tipo: 'R', lat: p.t.lat, lng: p.t.lng, desde: null, sig: p.d, s: p, prio: p.prio, hasta: p.hasta });
  const stE = (p, req) => ({ key: p.id + '|E', tipo: 'E', lat: p.d.lat, lng: p.d.lng, desde: p.desde, requiere: req, s: p, prio: p.prio, hasta: p.hasta });
  const stT = (p, q, req) => ({ key: p.id + '|T', tipo: 'T', lat: q.lat, lng: q.lng, desde: null, requiere: req, sig: p.d, s: p, prio: p.prio, hasta: p.hasta });
  const stB = (p, q) => ({ key: p.id + '|B', tipo: 'B', lat: q.lat, lng: q.lng, desde: null, sig: p.d, s: p, prio: p.prio, hasta: p.hasta });
  const directo = (p, needR) => (needR === false ? [] : [stR(p)]).concat([stE(p, needR === false ? null : p.id + '|R')]);

  // ── Preparación de pedidos
  const out = {};
  const ps = (E.pedidos || []).filter(p => ABIERTOS.indexOf(p.estado || 'Pendiente') >= 0).map(p => {
    const zo = p.t ? zonaDePunto_(E.zonas || [], p.ciudad, p.t.lat, p.t.lng) : null;
    const zd = p.d ? zonaDePunto_(E.zonas || [], p.ciudad, p.d.lat, p.d.lng) : null;
    const x = Object.assign({}, p, { zo, zd, prio: p.prio || 'Media' });
    out[p.id] = { A: p.A || '', B: p.B || '', modalidad: '', punto: p.punto || '', horaTrueque: p.horaTrueque, orden: null, etaR: null, etaE: null,
                  motivo: '', zonaO: zo ? zo.nombre + (zo.fuera ? ' (fuera)' : '') : '', zonaD: zd ? zd.nombre + (zd.fuera ? ' (fuera)' : '') : '', riesgo: false };
    return x;
  });
  const reasignable = (p) => E.asignar && !p.fijo && (p.estado || 'Pendiente') === 'Pendiente' && !p.intermunicipal;
  const puntoPorNombre = (nombre, ciudad) => (E.puntos || []).filter(q => N(q.nombre) === N(nombre) && (!ciudad || N(q.ciudad) === N(ciudad)))[0] || null;
  const esTrueque = (o) => o.B && N(o.B) !== N(o.A);
  const puntosPara = (p) => {   // puntos de encuentro válidos para el par de zonas; si no hay, todos los de la ciudad
    const zo = p.zo ? N(p.zo.nombre) : '', zd = p.zd ? N(p.zd.nombre) : '';
    const deCiudad = (E.puntos || []).filter(q => N(q.ciudad) === N(p.ciudad));
    const propios = deCiudad.filter(q => !q.zonas.length || (q.zonas.map(N).indexOf(zo) >= 0 && q.zonas.map(N).indexOf(zd) >= 0));
    return propios.length ? { lista: propios, alterno: false } : { lista: deCiudad, alterno: true };
  };

  // 1) Pedidos que se conservan como están (manuales, ya iniciados, o solo cálculo de rutas)
  const libres = [];
  ps.forEach(p => {
    const o = out[p.id];
    if (reasignable(p)) { libres.push(p); return; }
    if (p.intermunicipal && !p.A) { o.modalidad = 'Intermunicipal'; avisos.push({ tipo: 'intermunicipal', id: p.id, txt: 'Intermunicipal: asigna el mensajero a mano' }); return; }
    if (!o.A) {
      if (!p.t || !p.d) avisos.push({ tipo: 'sinUbic', id: p.id, txt: !p.t ? 'Tienda sin ubicación' : 'Dirección del cliente sin ubicar' });
      else avisos.push({ tipo: 'sinAsignar', id: p.id, txt: 'Sin mensajero' });
      return;
    }
    o.modalidad = p.intermunicipal ? 'Intermunicipal' : esTrueque(o) ? 'Trueque' : 'Directo';
    o.motivo = p.fijo ? 'Asignación manual' : (p.estado !== 'Pendiente' ? 'En curso: se conserva' : '');
    const a = D(o.A);
    if (!a) { avisos.push({ tipo: 'mensajero', id: p.id, txt: 'El mensajero "' + o.A + '" no existe o está inactivo' }); return; }
    if (!E.asignar) return;   // en solo cálculo no se arma la carga (las rutas se simulan al final)
    const est = p.estado || 'Pendiente', needR = est === 'Pendiente' || est === 'Aceptado';
    if (esTrueque(o)) {
      const q = puntoPorNombre(o.punto, p.ciudad), b = D(o.B);
      if (!q || !b) { avisos.push({ tipo: 'punto', id: p.id, txt: 'Trueque sin punto de encuentro o mensajero válido' }); return; }
      if (needR && p.t) poner(a, [stR(p)]);
      if (p.d && (needR || est === 'Recogido')) poner(a, [stT(p, q, needR ? p.id + '|R' : null)]);
      if (p.d) poner(b, est === 'Recibido' ? [stE(p, null)] : [stB(p, q), stE(p, p.id + '|B')]);
    } else if (p.d) poner(a, needR && p.t ? directo(p) : directo(p, false));
  });

  // 2) Asignación automática por costo marginal real: se simula la ruta con y sin el pedido
  const prioR = { Alta: 0, Media: 1, Baja: 2 };
  libres.forEach(p => { p._A = p.t ? drvZona(p.zo, p.ciudad, p.t) : null; p._B = p.d ? drvZona(p.zd, p.ciudad, p.d) : null; });
  libres.sort((x, y) => ((x._A === x._B) ? 0 : 1) - ((y._A === y._B) ? 0 : 1) || (prioR[x.prio] - prioR[y.prio]) || ((x.hasta || 1e4) - (y.hasta || 1e4)));
  const r = (x) => Math.round(x);
  /** Opciones de un pedido. candidatos = mensajeros que pueden hacer el directo; trueques entre (de, a). */
  const opcionesDe = (p, directos, pares) => {
    const ops = [];
    directos.forEach(X => { if (X) ops.push({ m: 'D', X, costo: delta(X, directo(p)) }); });
    if (p.prio !== 'Alta') pares.forEach(([A, B]) => {
      if (!A || !B || A === B) return;
      const pp = puntosPara(p);
      pp.lista.forEach(q => {
        const ca = delta(A, [stR(p), stT(p, q, p.id + '|R')]), cb = delta(B, [stB(p, q), stE(p, p.id + '|B')]);
        ops.push({ m: 'T', A, B, q, alterno: pp.alterno, ca, cb, costo: ca + cb + RUTA.MIN_TRUEQUE });
      });
    });
    return ops;
  };
  const aplicar = (p, op, motivo) => {
    const o = out[p.id];
    if (op.m === 'D') { o.A = op.X.nombre; o.B = ''; o.punto = ''; o.modalidad = 'Directo'; poner(op.X, directo(p)); }

/** Simula la ruta de cada mensajero (heurística voraz, misma lógica de la app) y escribe orden y horas en out. */
